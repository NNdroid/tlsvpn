name: apply-ciphertext-tail-carry

on:
  push:
    branches:
      - perf/ciphertext-sub-mss-tail-carry-integrated-20260929

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Apply source patch
        run: python3 .github/apply_ciphertext_tail_carry.py
      - name: Format and focused validation
        run: |
          gofmt -w client.go server.go ciphertext_tail_conn.go *_test.go
          go test ./... -run '^$' -count=1 -timeout=60s
          go test ./... -run 'TestCiphertextTailConn|TestStream|TestFrameScanner|TestFEC' -count=1 -timeout=90s
          go test -race ./... -run 'TestCiphertextTailConn|TestStream|TestFrameScanner' -count=1 -timeout=90s
          git diff --check
      - name: Commit final source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: carry sub-MSS TLS ciphertext tails across writes'
          git push origin HEAD:perf/ciphertext-sub-mss-tail-carry-integrated-20260929
