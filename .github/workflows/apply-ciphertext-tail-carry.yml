name: Apply ciphertext sub-MSS carry integration

on:
  push:
    branches:
      - perf/ciphertext-sub-mss-tail-carry-integrated-20260929

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Integrate ciphertext tail carry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {n}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          # Do not slide the deadline forward on every small TLS write.  The
          # oldest carried byte gets a hard bounded latency.
          replace_once('ciphertext_tail_conn.go', '''\tif c.timer == nil {
\t\tc.timer = time.AfterFunc(c.delay, c.flushFromTimer)
\t\tc.timerArmed = true
\t\treturn
\t}
\t// Reuse the same runtime timer instead of allocating one per TLS record.
\t// Reset starts a fresh bounded wait from the newest carried real-data tail.
\tc.timer.Stop()
\tc.timer.Reset(c.delay)
\tc.timerArmed = true
''', '''\tif c.timerArmed {
\t\t// Keep the original deadline: frequent sub-MSS writes must not postpone
\t\t// the oldest real byte indefinitely.
\t\treturn
\t}
\tif c.timer == nil {
\t\tc.timer = time.AfterFunc(c.delay, c.flushFromTimer)
\t} else {
\t\t// Reuse the same runtime timer after a previous deadline fired.
\t\tc.timer.Reset(c.delay)
\t}
\tc.timerArmed = true
''')

          # Let generic socket helpers see through this wrapper when needed.
          replace_once('ciphertext_tail_conn.go', '''func newCiphertextTailConnWithDelay(conn net.Conn, delay time.Duration) *ciphertextTailConn {
\tif delay <= 0 {
\t\tdelay = ciphertextTailCarryDelay
\t}
\treturn &ciphertextTailConn{Conn: conn, delay: delay}
}
''', '''func newCiphertextTailConnWithDelay(conn net.Conn, delay time.Duration) *ciphertextTailConn {
\tif delay <= 0 {
\t\tdelay = ciphertextTailCarryDelay
\t}
\treturn &ciphertextTailConn{Conn: conn, delay: delay}
}

func (c *ciphertextTailConn) Unwrap() net.Conn { return c.Conn }

// ciphertextCarryMSS uses the MSS of the actual local TCP socket.  This is
// deliberately valid under SOCKS5 too: the wrapper sits on that local TCP byte
// stream, so the proxy-hop MSS is the segment size we need to fill.
func ciphertextCarryMSS(conn net.Conn) int {
\ttcp := underlyingTCPConn(conn)
\tif tcp != nil {
\t\tif mss, err := getTCPMSS(tcp); err == nil && mss >= 256 {
\t\t\treturn mss
\t\t}
\t}
\treturn fallbackTCPMSS
}
''')

          # Client: create the wrapper below uTLS, keep it disabled for both TLS
          # and TLSVPN handshakes, then enable it immediately before the data
          # backend can receive frames.
          replace_once('client.go', '''\ttcpConn := asTCPConn(rawConn)
\tpadRecordLimit := paddingRecordLimit(tcpConn)
''', '''\ttcpConn := asTCPConn(rawConn)
\tpadRecordLimit := paddingRecordLimit(tcpConn)
\tcarryMSS := ciphertextCarryMSS(rawConn)
\tcipherTail := newCiphertextTailConn(rawConn)
''')
          replace_once('client.go', '''\ttlsConn, err := c.negotiateUTLS(runCtx, rawConn, lv)
''', '''\ttlsConn, err := c.negotiateUTLS(runCtx, cipherTail, lv)
''')
          replace_once('client.go', '''\terrChan := make(chan error, 2)
\tconnTxChan := make(chan []VPNFrame, 32)
\tc.txPort.RegisterBackend(connTxChan, rttCache)
''', '''\t// TLS and TLSVPN authentication are complete.  Only the data plane may
\t// carry a final real ciphertext tail into the next TLS write.
\tcipherTail.Enable(carryMSS)

\terrChan := make(chan error, 2)
\tconnTxChan := make(chan []VPNFrame, 32)
\tc.txPort.RegisterBackend(connTxChan, rttCache)
''')

          # Server: place the wrapper below crypto/tls but leave it disabled
          # through TLS, protocol sniffing, camouflage and TLSVPN authentication.
          replace_once('server.go', '''\t\t\ttlsConn := tls.Server(prefixConn, connTLSConfig)
''', '''\t\t\tcipherTail := newCiphertextTailConn(prefixConn)
\t\t\ttlsConn := tls.Server(cipherTail, connTLSConfig)
''')
          replace_once('server.go', '''\t\t\tsrv.handleConnection(ctx, prefixConn2, c, tlsInfo)
''', '''\t\t\tsrv.handleConnection(ctx, prefixConn2, c, tlsInfo, cipherTail)
''')
          replace_once('server.go', '''func (s *Server) handleConnection(parentCtx context.Context, conn net.Conn, tcpConn *net.TCPConn, tlsInfo *TLSHandshakeInfo) {
''', '''func (s *Server) handleConnection(parentCtx context.Context, conn net.Conn, tcpConn *net.TCPConn, tlsInfo *TLSHandshakeInfo, cipherTail *ciphertextTailConn) {
''')
          replace_once('server.go', '''\trttCache := new(uint32)
\tatomic.StoreUint32(rttCache, 50000)
''', '''\t// HandshakeResp is already on the wire.  Enable sub-MSS carry only now,
\t// before this physical backend can receive any data-plane frames.
\tif cipherTail != nil {
\t\tcipherTail.Enable(ciphertextCarryMSS(tcpConn))
\t}

\trttCache := new(uint32)
\tatomic.StoreUint32(rttCache, 50000)
''')

          # Update direct unit-test invocations of the internal server handler.
          for p in Path('.').glob('*_test.go'):
              s = p.read_text()
              s2 = s.replace('srv.handleConnection(ctx, srvConn, srvConn, nil)',
                             'srv.handleConnection(ctx, srvConn, srvConn, nil, nil)')
              if s2 != s:
                  p.write_text(s2)

          # Record individual underlying writes so tests prove that sustained
          # traffic emits full-MSS prefixes rather than merely preserving totals.
          replace_once('ciphertext_tail_conn_test.go', '''type captureNetConn struct {
\tmu     sync.Mutex
\tbuf    bytes.Buffer
\tclosed bool
}
''', '''type captureNetConn struct {
\tmu     sync.Mutex
\tbuf    bytes.Buffer
\twrites []int
\tclosed bool
}
''')
          replace_once('ciphertext_tail_conn_test.go', '''\tif c.closed {
\t\treturn 0, net.ErrClosed
\t}
\treturn c.buf.Write(p)
''', '''\tif c.closed {
\t\treturn 0, net.ErrClosed
\t}
\tc.writes = append(c.writes, len(p))
\treturn c.buf.Write(p)
''')
          replace_once('ciphertext_tail_conn_test.go', '''func (c *captureNetConn) Bytes() []byte {
\tc.mu.Lock()
\tdefer c.mu.Unlock()
\treturn append([]byte(nil), c.buf.Bytes()...)
}
''', '''func (c *captureNetConn) Bytes() []byte {
\tc.mu.Lock()
\tdefer c.mu.Unlock()
\treturn append([]byte(nil), c.buf.Bytes()...)
}
func (c *captureNetConn) WriteSizes() []int {
\tc.mu.Lock()
\tdefer c.mu.Unlock()
\treturn append([]int(nil), c.writes...)
}
''')
          replace_once('ciphertext_tail_conn_test.go', '''\tif got := c.pending(); got != 0 {
\t\tt.Fatalf("second pending=%d want 0", got)
\t}

\twant := append(append([]byte(nil), first...), second...)
''', '''\tif got := c.pending(); got != 0 {
\t\tt.Fatalf("second pending=%d want 0", got)
\t}
\tif got := under.WriteSizes(); len(got) != 2 || got[0] != 1440 || got[1] != 1440 {
\t\tt.Fatalf("underlying writes=%v want [1440 1440]", got)
\t}

\twant := append(append([]byte(nil), first...), second...)
''')

          # The staging workflow must not remain in the PR.
          Path('.github/workflows/apply-ciphertext-tail-carry.yml').unlink()
          PY
          gofmt -w client.go server.go ciphertext_tail_conn.go ciphertext_tail_conn_test.go *_test.go
      - name: Validate focused behavior
        run: |
          go test ./... -run 'TestCiphertextTailConn|TestStream|TestFrameScanner|TestFEC' -count=1
          go test -race ./... -run 'TestCiphertextTailConn|TestStream|TestFrameScanner' -count=1
          go test ./... -count=1
          git diff --check
          grep -R 'handleConnection(' -- *.go | head -20
      - name: Commit final source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: carry sub-MSS TLS ciphertext tails across writes'
          git push origin HEAD:perf/ciphertext-sub-mss-tail-carry-integrated-20260929
