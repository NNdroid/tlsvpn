name: Apply multipath bulk trigger experiment

on:
  push:
    branches:
      - perf/multipath-bulk-trigger

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/multipath-bulk-trigger
          fetch-depth: 0

      - name: Patch AsyncPort bulk hint propagation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('client.go')
          s = p.read_text()

          old = "\t\t\tp.dispatchBatch(batch)\n\n\t\t\tbatch = batch[:0]"
          new = "\t\t\t// queueLen 是 drain 前的积压快照；len(batch) 则保留‘这一轮已经聚成大批量’的事实。\n\t\t\t// 旧实现只在 dispatch 时重新看 len(p.ch)，队列刚被 drain 空时会误判为交互流量。\n\t\t\tbulk := queueLen >= multipathStripeBacklog || len(batch) >= multipathStripeBatchFrames\n\t\t\tp.dispatchBatch(batch, bulk)\n\n\t\t\tbatch = batch[:0]"
          if old not in s:
              raise SystemExit('dispatch call site not found')
          s = s.replace(old, new, 1)

          old = "func (p *AsyncPort) dispatchBatch(batch []VPNFrame) {"
          new = "func (p *AsyncPort) dispatchBatch(batch []VPNFrame, bulk bool) {"
          if old not in s:
              raise SystemExit('dispatchBatch signature not found')
          s = s.replace(old, new, 1)

          marker = "const multipathStripeBacklog = 64"
          before, sep, after = s.partition(marker)
          if not sep:
              raise SystemExit('multipathStripeBacklog marker not found')
          count = before.count("p.pickDataBackend(backends)")
          if count != 2:
              raise SystemExit(f'expected 2 dispatch pickDataBackend calls, found {count}')
          before = before.replace("p.pickDataBackend(backends)", "p.pickDataBackendFor(backends, bulk)")
          s = before + sep + after

          old = "const multipathStripeBacklog = 64\n"
          new = "const (\n\tmultipathStripeBacklog = 64\n\tmultipathStripeBatchFrames = 32\n)\n"
          if old not in s:
              raise SystemExit('multipath constant not found')
          s = s.replace(old, new, 1)

          old = "func (p *AsyncPort) pickDataBackend(backends []*Backend) *Backend {\n\tbest := p.pickBackend(backends)\n\tif len(backends) < 2 || len(p.ch) < multipathStripeBacklog || best == nil {\n\t\treturn best\n\t}\n"
          new = "func (p *AsyncPort) pickDataBackend(backends []*Backend) *Backend {\n\treturn p.pickDataBackendFor(backends, len(p.ch) >= multipathStripeBacklog)\n}\n\n// pickDataBackendFor 接收 run goroutine 捕获的 bulk 快照。这样一次大批量已经\n// drain 掉 p.ch 后仍能 striping；直接调用 pickDataBackend 的交互/测试语义不变。\nfunc (p *AsyncPort) pickDataBackendFor(backends []*Backend, bulk bool) *Backend {\n\tbest := p.pickBackend(backends)\n\tif len(backends) < 2 || !bulk || best == nil {\n\t\treturn best\n\t}\n"
          if old not in s:
              raise SystemExit('pickDataBackend body not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit experiment and remove patch workflow
        run: |
          git rm .github/workflows/apply-multipath-bulk.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add client.go
          git commit -m 'perf: preserve bulk hint after AsyncPort drain'
          git push origin HEAD:perf/multipath-bulk-trigger
