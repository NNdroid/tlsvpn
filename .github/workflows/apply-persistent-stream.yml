name: Apply persistent stream patch

on:
  push:
    branches:
      - perf/persistent-stream-packing-20260929
    paths:
      - scripts/apply_persistent_stream_patch.py
      - .github/workflows/apply-persistent-stream.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/persistent-stream-packing-20260929
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply source patch
        run: python3 scripts/apply_persistent_stream_patch.py
      - name: Remove invalid inner cancellation branches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name, marker in [('client.go', 'case <-c.ctx.Done():'), ('server.go', 'case <-ctx.Done():')]:
              p = Path(name)
              s = p.read_text()
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit(f'{name}: cancellation marker not found')
              line_start = s.rfind('\n', 0, pos) + 1
              # Remove marker + the indented timer-stop block + return. The next line
              # is the select-closing brace at one indentation level less.
              end_marker = '\n\t\t\t\t\t\t}'
              end = s.find(end_marker, pos)
              if end < 0:
                  raise SystemExit(f'{name}: cancellation block end not found')
              s = s[:line_start] + s[end:]
              p.write_text(s)
          PY
      - name: Format
        run: gofmt -w client.go server.go stream_padding.go
      - name: Test
        run: |
          go test ./...
          go test -race ./... -run 'TestStream|TestFrame|TestOwned|TestWeb|TestStats'
      - name: Remove temporary patch helpers
        run: rm -f scripts/apply_persistent_stream_patch.py .github/workflows/apply-persistent-stream.yml
      - name: Commit final source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: pack TLSVPN stream across frame boundaries'
          git push origin HEAD:perf/persistent-stream-packing-20260929
