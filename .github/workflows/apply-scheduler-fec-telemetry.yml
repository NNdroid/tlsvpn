name: Apply scheduler FEC telemetry fix

on:
  push:
    branches:
      - fix/scheduler-fec-telemetry

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scheduler-fec-telemetry
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply fix
        run: python3 scripts/apply_scheduler_fec_telemetry.py
      - name: Format and unit-test focused telemetry
        run: |
          gofmt -w client.go adaptive_multipath.go scheduler_fec_telemetry_test.go
          go test ./... -run 'TestFECParitySchedulerTelemetry|TestSchedulerSnapshotExposesState' -count=1
      - name: Commit generated fix and remove one-shot files
        run: |
          git rm scripts/apply_scheduler_fec_telemetry.py .github/workflows/apply-scheduler-fec-telemetry.yml
          git add client.go adaptive_multipath.go webui/metrics.js scheduler_fec_telemetry_test.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(webui): account for FEC parity in scheduler telemetry'
          git push origin HEAD:fix/scheduler-fec-telemetry
