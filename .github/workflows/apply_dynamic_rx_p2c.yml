name: Apply Dynamic RX P2c Cleanup

on:
  push:
    branches:
      - research/dynamic-rx-fec-bypass
    paths:
      - scripts/apply_dynamic_rx_p2c.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Apply P2c source patch
        run: python3 scripts/apply_dynamic_rx_p2c.py
      - name: Format
        run: gofmt -w buffer.go fec.go client.go server.go fec_dynamic_bypass_p2c_test.go
      - name: Validate dynamic FEC cleanup
        run: |
          go build ./...
          go test ./... -count=1 -run 'FEC|Dynamic|ReorderExpected'
          go test -race ./... -count=1 -run 'FEC|Dynamic|ReorderExpected'
      - name: Commit applied cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add buffer.go fec.go client.go server.go fec_dynamic_bypass_p2c_test.go
          git commit -m 'perf: retire stale RX FEC groups after bypass fences'
          git push origin HEAD:research/dynamic-rx-fec-bypass
