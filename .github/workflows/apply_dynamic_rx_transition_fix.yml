name: Apply Dynamic RX Transition Fix

on:
  push:
    branches:
      - research/dynamic-rx-fec-bypass
    paths:
      - scripts/apply_dynamic_rx_transition_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Apply transition fix
        run: python3 scripts/apply_dynamic_rx_transition_fix.py
      - name: Format
        run: gofmt -w fec.go
      - name: Validate full FEC surface
        run: |
          go build ./...
          go test ./... -count=1 -run 'FEC|Dynamic'
          go test -race ./... -count=1 -run 'FEC|Dynamic'
      - name: Commit applied fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fec.go
          git commit -m 'fix: fence only real dynamic FEC transitions'
          git push origin HEAD:research/dynamic-rx-fec-bypass
