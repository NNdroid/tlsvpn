name: Apply Real-TAP FEC coverage

on:
  push:
    branches:
      - perf/single-path-fec-bypass

permissions:
  contents: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply FEC perf harness patch
        run: python3 scripts/apply_perf_fec.py

      - name: Validate shell and workflow edits
        run: |
          bash -n scripts/real_tap_perf.sh
          grep -q 'PERF_FEC=true' .github/workflows/perf.yml
          grep -q 'fec-comparison.tsv' .github/workflows/perf.yml

      - name: Upload patched harness files
        uses: actions/upload-artifact@v4
        with:
          name: patched-fec-perf-harness
          path: |
            scripts/real_tap_perf.sh
            .github/workflows/perf.yml
          retention-days: 1
