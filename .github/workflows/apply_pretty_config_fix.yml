name: Apply pretty generated JSON fix

on:
  push:
    branches: [ "fix/pretty-generated-json" ]
    paths:
      - ".github/scripts/patch_pretty_config.py"
      - ".github/workflows/apply_pretty_config_fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Apply patch
        run: python3 .github/scripts/patch_pretty_config.py
      - name: Validate
        run: |
          gofmt -w installer_config_format_test.go
          bash -n scripts/install.sh
          go test ./... -run 'TestInstallerWritesReadableJSON|TestInstallScriptContract' -count=1
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/install.sh installer_config_format_test.go
          git commit -m 'fix: pretty-print generated installer JSON' || exit 0
          git push origin HEAD:fix/pretty-generated-json
