name: Apply Go version/readme audit

on:
  push:
    branches: [ "fix/version-readme-audit" ]
    paths:
      - ".github/scripts/patch_version_readme.py"
      - ".github/workflows/apply_version_readme_fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Apply audited patch
        run: |
          python3 .github/scripts/patch_version_readme.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("version_cli_test.go")
          s = p.read_text()
          s = s.replace('    "flag"\n', '')
          s = s.replace('    if flag.Lookup("version") == nil {\n        t.Fatal("-version flag is not registered")\n    }\n', '')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          gofmt -w main.go version_cli_test.go
          bash -n scripts/install.sh
          go test ./... -run 'TestVersionFlagAndDocsContract|TestInstallScriptContract' -count=1
          go build -ldflags "-X main.appVersion=ci-version-test" -o /tmp/tlsvpn-version-test .
          test "$(/tmp/tlsvpn-version-test -version)" = "ci-version-test"
          test "$(/tmp/tlsvpn-version-test --version)" = "ci-version-test"
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.go scripts/install.sh README.md .github/workflows/go.yml version_cli_test.go
          git commit -m 'feat: add version CLI and refresh README' || exit 0
          git push origin HEAD:fix/version-readme-audit
