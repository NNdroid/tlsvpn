name: Assemble Go Installer

on:
  push:
    branches: [ "feat/go-installer" ]
    paths:
      - ".installer_parts/**"
      - ".github/workflows/assemble-go-installer.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and validate
        run: |
          mkdir -p scripts
          cat .installer_parts/part-* > scripts/install.sh
          chmod +x scripts/install.sh scripts/test_install.sh
          bash -n scripts/install.sh
          bash scripts/test_install.sh
      - name: Commit generated installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/install.sh scripts/test_install.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add Go one-click installer"
          git push
