name: Async TAP v2 Performance

on:
  push:
    branches:
      - 'perf/async-tap-delivery-v2'
  workflow_dispatch:

jobs:
  paired-real-tap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install real-TAP benchmark dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iproute2 iperf3 openssl

      - name: Validate async TAP v2 implementation
        run: |
          gofmt -w tap_delivery.go tap_delivery_test.go tap_delivery_bench_test.go
          go test -count=1 ./... -run 'TestOwnedTapDelivery|TestAsyncTapDeliveryQueue'
          go test -run '^$' -bench BenchmarkOwnedTapDelivery -benchtime=1s -count=1
          bash -n scripts/real_tap_perf.sh
          bash -n scripts/async_tap_v2_perf.sh

      - name: Build candidate and main baseline
        run: |
          mkdir -p perf-bin perf-artifacts
          go build -trimpath -o "$PWD/perf-bin/tlsvpn-candidate" .
          (cd baseline && go build -trimpath -o "$OLDPWD/perf-bin/tlsvpn-main" .)

      - name: Run repeated paired real-TAP A/B
        env:
          MAIN_BIN: ${{ github.workspace }}/perf-bin/tlsvpn-main
          CANDIDATE_BIN: ${{ github.workspace }}/perf-bin/tlsvpn-candidate
          PERF_SECONDS: '10'
          OUTPUT: ${{ github.workspace }}/perf-artifacts/async-tap-v2-raw.tsv
        run: |
          bash scripts/async_tap_v2_perf.sh

      - name: Upload async TAP v2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-tap-v2-perf
          path: perf-artifacts/
          retention-days: 30
