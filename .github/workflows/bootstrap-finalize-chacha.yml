name: Bootstrap finalize ChaCha AEAD

on:
  push:
    branches:
      - 'feat/chacha-inner-aead'

permissions:
  contents: write

jobs:
  apply:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Apply final fixes and test
        run: |
          python3 scripts/finalize_chacha_inner_aead.py
          gofmt -w fec.go chacha_cipher_test.go api.go config_test.go
          go test -count=1 ./...
          bash tests/test_openwrt_integration.sh
      - name: Commit final candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/finalize_chacha_inner_aead.py .github/workflows/bootstrap-finalize-chacha.yml
          git add fec.go chacha_cipher_test.go webui/app.js openwrt/luci-proto-tlsvpn/htdocs/luci-static/resources/protocol/tlsvpn.js openwrt/luci-proto-tlsvpn/po/zh_Hans/tlsvpn.po api.go README.md config_test.go
          git commit -m 'fix(crypto): make ChaCha integration AEAD-generic'
          git push origin HEAD:feat/chacha-inner-aead
