name: Bootstrap owned session reorder optimization

on:
  push:
    branches:
      - perf/owned-session-reorder

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply optimization and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/bootstrap_owned.py
          rm -f .github/bootstrap_owned.py .github/workflows/bootstrap-owned-session-reorder.yml
          gofmt -w buffer.go server.go owned_reorder_test.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: transfer reordered session frames without copy"
          git push origin HEAD:perf/owned-session-reorder
