name: Bootstrap peer metadata session refresh

on:
  push:
    branches: ["fix/peer-info-session-refresh"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/peer-info-session-refresh
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Clear stale metadata when current peer omits peer_info
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.go')
          s = p.read_text()
          old = '''\tif req.PeerInfo != nil {\n\t\tsession.sessionMu.Lock()\n\t\tsession.PeerInfo = normalizePeerInfo(req.PeerInfo)\n\t\tsession.sessionMu.Unlock()\n\t}\n'''
          new = '''\t// peer_info describes the peer on this authenticated handshake. During a\n\t// rolling downgrade an older client omits it, so overwrite with the empty\n\t// normalized value instead of retaining identity from a previous connection.\n\tsession.sessionMu.Lock()\n\tsession.PeerInfo = normalizePeerInfo(req.PeerInfo)\n\tsession.sessionMu.Unlock()\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one peer refresh block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          gofmt -w server.go
          go test ./...
      - name: Commit fix and remove bootstrap workflow
        run: |
          git config user.name NNdroid
          git config user.email 99177648+NNdroid@users.noreply.github.com
          git rm .github/workflows/bootstrap-peer-refresh.yml
          git add server.go
          git commit -m "fix(protocol): clear stale peer metadata on reconnect"
          git push origin HEAD:fix/peer-info-session-refresh
