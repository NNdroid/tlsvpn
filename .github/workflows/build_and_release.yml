name: Build and Release (Script Based)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-native:
    name: Build native binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Show native release matrix
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh --list

      - name: Run native build script
        env:
          HOST_ALIAS: "0"
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.run_number) }}
        run: ./scripts/build.sh linux

      - name: Verify native release assets
        run: |
          for asset in \
            tlsvpn_linux_amd64 \
            tlsvpn_linux_amd64_v2 \
            tlsvpn_linux_amd64_v3 \
            tlsvpn_linux_amd64_v4 \
            tlsvpn_linux_386 \
            tlsvpn_linux_arm64 \
            tlsvpn_linux_arm64_v8.2 \
            tlsvpn_linux_arm_v5 \
            tlsvpn_linux_arm_v6 \
            tlsvpn_linux_arm \
            tlsvpn_linux_mipsle \
            tlsvpn_linux_mips \
            tlsvpn_linux_mips64le \
            tlsvpn_linux_mips64 \
            tlsvpn_linux_riscv64 \
            tlsvpn_linux_ppc64le \
            tlsvpn_linux_ppc64le_power9 \
            tlsvpn_linux_ppc64le_power10 \
            tlsvpn_linux_ppc64 \
            tlsvpn_linux_s390x \
            tlsvpn_linux_loong64; do
            test -s "bin/$asset" || { echo "missing native asset: $asset" >&2; exit 1; }
          done
          test -s bin/SHA256SUMS-native.txt
          (cd bin && sha256sum -c SHA256SUMS-native.txt)

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: |
            bin/tlsvpn_*
            bin/SHA256SUMS-native.txt
          if-no-files-found: error
          retention-days: 7

  build-openwrt-apk:
    name: OpenWrt APK - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            target: x86
            subtarget: "64"
            include_arch_independent: "1"
          - name: armsr-armv8
            target: armsr
            subtarget: armv8
            include_arch_independent: "0"
          - name: armsr-armv7
            target: armsr
            subtarget: armv7
            include_arch_independent: "0"
          - name: rockchip-armv8
            target: rockchip
            subtarget: armv8
            include_arch_independent: "0"
          - name: mediatek-filogic
            target: mediatek
            subtarget: filogic
            include_arch_independent: "0"
          - name: ramips-mt7621
            target: ramips
            subtarget: mt7621
            include_arch_independent: "0"
          - name: ath79-generic
            target: ath79
            subtarget: generic
            include_arch_independent: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenWrt SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk gettext git libncurses-dev \
            libssl-dev python3 rsync unzip zlib1g-dev file curl zstd

      - name: Build OpenWrt APK packages
        env:
          OPENWRT_VERSION: "25.12.5"
          OPENWRT_TARGET: ${{ matrix.target }}
          OPENWRT_SUBTARGET: ${{ matrix.subtarget }}
          OPENWRT_INCLUDE_ARCH_INDEPENDENT: ${{ matrix.include_arch_independent }}
          OPENWRT_WORK_DIR: ${{ runner.temp }}/tlsvpn-openwrt-sdk/25.12.5-${{ matrix.target }}-${{ matrix.subtarget }}
          TLSVPN_SOURCE_VERSION: ${{ github.sha }}
          TLSVPN_PKG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          JOBS: "2"
        run: |
          chmod +x scripts/build_openwrt_apk.sh
          ./scripts/build_openwrt_apk.sh

      - name: Upload OpenWrt APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-apk-${{ matrix.name }}
          path: |
            bin/openwrt/${{ matrix.target }}-${{ matrix.subtarget }}/*.apk
            bin/openwrt/${{ matrix.target }}-${{ matrix.subtarget }}/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - build-native
      - build-openwrt-apk
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -maxdepth 2 -type f -print | sort

      - name: Verify downloaded native checksums
        run: |
          test -s release-assets/SHA256SUMS-native.txt
          (cd release-assets && sha256sum -c SHA256SUMS-native.txt)

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/tlsvpn_*
            release-assets/*.apk
            release-assets/SHA256SUMS-*.txt
          draft: false
          prerelease: false
          body: |
            Automatic build for tag ${{ github.ref_name }}.

            Native Linux binaries include broad compatibility baselines plus
            CPU-optimized variants:
            - amd64: generic v1 plus GOAMD64 v2, v3 and v4
            - arm64: generic v8.0 plus ARM64 v8.2
            - arm: v5, v6 and the existing v7-compatible baseline
            - mips/mips64 (LE/BE), riscv64, ppc64/ppc64le, s390x and loong64
            - ppc64le also includes POWER9 and POWER10 optimized variants

            `SHA256SUMS-native.txt` covers all native binaries. Higher ISA
            variants require a matching CPU; use the generic artifact when in doubt.

            OpenWrt 25.12.5 APK packages are also attached. OpenWrt protocol/LuCI
            packages are architecture-independent and are emitted once by the
            x86/64 SDK build; target-specific tlsvpn APKs are suffixed with their
            OpenWrt target/subtarget.
