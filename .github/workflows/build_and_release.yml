name: Build and Release (Script Based)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '指定版本号（如 v1.0.20261120-abc1234+5）；留空则按规则 v1.0.<提交日期yyyymmdd>-<commit哈希前7位>+<v标签数+1> 自动生成'
        required: false
        type: string
        default: ''

jobs:
  compute-version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: compute
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            # 手动触发且显式指定版本号：直接采用用户输入
            VERSION="$INPUT_VERSION"
          elif [[ "$REF" == refs/tags/* ]]; then
            # 标签推送：标签名本身即版本号
            VERSION="$REF_NAME"
          else
            # 规则自动生成：v1.0.<提交日期 yyyyMMdd>-<commit哈希前7位>+<v标签数+1>
            COMMIT_DATE="$(git log -1 --format=%cd --date=format:%Y%m%d)"
            COMMIT_HASH="$(git rev-parse --short=7 HEAD)"
            TAG_COUNT="$(git tag --list 'v*' | wc -l)"
            VERSION="v1.0.${COMMIT_DATE}-${COMMIT_HASH}+$((TAG_COUNT + 1))"
          fi
          # 去掉首尾空白，并做轻量校验
          VERSION="$(printf '%s' "$VERSION" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [ -z "$VERSION" ]; then
            echo "::error::Version resolved to an empty string." >&2
            exit 1
          fi
          if printf '%s' "$VERSION" | grep -q '[[:space:]]'; then
            echo "::error::Version must not contain whitespace: '$VERSION'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  build-native:
    name: Build native binaries
    runs-on: ubuntu-latest
    needs: compute-version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Show native release matrix
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh --list

      - name: Run native build script
        env:
          HOST_ALIAS: "0"
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: ./scripts/build.sh linux

      - name: Verify native release assets
        run: |
          for asset in \
            tlsvpn_linux_amd64 \
            tlsvpn_linux_amd64_v2 \
            tlsvpn_linux_amd64_v3 \
            tlsvpn_linux_amd64_v4 \
            tlsvpn_linux_386 \
            tlsvpn_linux_arm64 \
            tlsvpn_linux_arm64_v8.2 \
            tlsvpn_linux_arm_v5 \
            tlsvpn_linux_arm_v6 \
            tlsvpn_linux_arm \
            tlsvpn_linux_mipsle \
            tlsvpn_linux_mips \
            tlsvpn_linux_mips64le \
            tlsvpn_linux_mips64 \
            tlsvpn_linux_riscv64 \
            tlsvpn_linux_ppc64le \
            tlsvpn_linux_ppc64le_power9 \
            tlsvpn_linux_ppc64le_power10 \
            tlsvpn_linux_ppc64 \
            tlsvpn_linux_s390x \
            tlsvpn_linux_loong64; do
            test -s "bin/$asset" || { echo "missing native asset: $asset" >&2; exit 1; }
          done
          test -s bin/SHA256SUMS-native.txt
          (cd bin && sha256sum -c SHA256SUMS-native.txt)

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: |
            bin/tlsvpn_*
            bin/SHA256SUMS-native.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-native
      - compute-version
    permissions:
      contents: write
      # Triggering the openwrt_customfeed.yml workflow_dispatch via
      # GITHUB_TOKEN needs actions:write on this job.
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release tag exists
        id: ensure-tag
        shell: bash
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          # 标签推送时标签已存在；手动触发时按计算出的版本号创建并推送标签。
          git fetch --quiet --tags origin
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            git tag "$VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$VERSION"
            echo "Created and pushed tag $VERSION at $GITHUB_SHA"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $VERSION already exists; reusing it."
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -maxdepth 2 -type f -print | sort

      - name: Verify downloaded native checksums
        run: |
          test -s release-assets/SHA256SUMS-native.txt
          (cd release-assets && sha256sum -c SHA256SUMS-native.txt)

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute-version.outputs.version }}
          files: |
            release-assets/tlsvpn_*
            release-assets/SHA256SUMS-*.txt
          draft: false
          prerelease: false
          body: |
            Release ${{ needs.compute-version.outputs.version }}.

            Native Linux binaries include broad compatibility baselines plus
            CPU-optimized variants:
            - amd64: generic v1 plus GOAMD64 v2, v3 and v4
            - arm64: generic v8.0 plus ARM64 v8.2
            - arm: v5, v6 and the existing v7-compatible baseline
            - mips/mips64 (LE/BE), riscv64, ppc64/ppc64le, s390x and loong64
            - ppc64le also includes POWER9 and POWER10 optimized variants

            `SHA256SUMS-native.txt` covers all native binaries. Higher ISA
            variants require a matching CPU; use the generic artifact when in doubt.

            OpenWrt 25.12+ APK packages (tlsvpn, tlsvpn-proto and the LuCI
            protocol package) are not attached here; they are built, signed and
            published exclusively through the openwrt-feed custom feed.

      - name: Trigger OpenWrt custom feed publication
        if: github.event_name == 'workflow_dispatch' && steps.ensure-tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          # GITHUB_TOKEN 的 git push 不会启动其他工作流，因此手动触发的
          # release 否则会让 OpenWrt feed 停留在旧版本。workflow_dispatch
          # 是 GITHUB_TOKEN 允许触发新工作流运行的例外：把 feed 锚定在
          # 刚发布的标签上，feed 源码与包版本始终与 GitHub Release 一致。
          # 标签推送事件本身会自动触发 feed，无需在此重复 dispatch。
          gh workflow run openwrt_customfeed.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$VERSION" -f publish=true
          echo "Dispatched openwrt_customfeed for $VERSION (publish=true)"
