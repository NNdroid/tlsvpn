name: Build and Release (Script Based)

on:
  push:
    tags:
      - 'v*' # 僅在推送 v* tag 時觸發

jobs:
  build:
    name: Build with scripts/build.sh
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許建立 Release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取完整历史与 tags，供 build.sh 的 git describe 取版本号

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'   # go.mod 声明 go 1.26；stable 避免隐式 toolchain 下载

      - name: Run Build Script
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          files: bin/* # 直接上傳 bin 目錄下編譯好的所有檔案
          draft: false
          prerelease: false
          body: "Automatic build for tag ${{ github.ref_name }}"
