name: Cross-Implementation E2E

# End-to-end interop tests between the released Go (tlsvpn) and Rust (tlsvpn-rs)
# builds. Downloads the latest GitHub release of BOTH projects and exercises the
# control groups: self-self (Go↔Go, Rust↔Rust) and cross-language
# (Go-server↔Rust-client, Rust-server↔Go-client) plus a SOCKS5 client group.

# This workflow is intended to be invoked only via `workflow_call` (see the
# `e2e` job in go.yml). A previous setup also had `on: push` here, which caused
# every push to main to trigger it TWICE: once from go.yml's `uses:` and once
# from this file's own push trigger. Keeping it `workflow_call`-only means there
# is a single, unambiguous entry point.

on:
  workflow_call:
    inputs:
      go_tag:
        description: "tlsvpn release tag (default: latest)"
        type: string
        required: false
        default: "latest"
      rs_tag:
        description: "tlsvpn-rs release tag (default: latest)"
        type: string
        required: false
        default: "latest"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Go repo)
        uses: actions/checkout@v4

      - name: Install test deps
        run: |
          sudo apt-get update
          # microsocks provides the SOCKS5 proxy for groups E/F. If the package
          # is unavailable on this runner image, those groups skip gracefully.
          sudo apt-get install -y microsocks 2>/dev/null || echo "microsocks not available — SOCKS5 groups will skip"

      - name: Run e2e control groups (download release binaries)
        env:
          E2E_USE_RELEASE: "1"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          E2E_GO_TAG: "${{ github.event.inputs.go_tag || 'latest' }}"
          E2E_RS_TAG: "${{ github.event.inputs.rs_tag || 'latest' }}"
        run: |
          chmod +x scripts/*.sh
          bash scripts/e2e_test.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/tlsvpn-test.*/**
          if-no-files-found: ignore
