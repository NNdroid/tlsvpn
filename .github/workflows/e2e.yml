name: Cross-Implementation E2E

# End-to-end interop tests between the Go (tlsvpn) and Rust (tlsvpn-rs)
# implementations. Both are fetched from their repositories and built from
# source on the runner, then exercised as control groups:
#   - self-self:        Go<->Go, Rust<->Rust
#   - cross-language:   Go-server<->Rust-client and Rust-server<->Go-client,
#                       each on the default configuration AND on varied wire
#                       configurations (encryption floor, padding mode,
#                       session token, FEC group size), so a protocol
#                       divergence hidden behind non-default settings is caught
#   - SOCKS5 client proxy groups, and the in-process perf suite
# Pre-compiled release binaries are never downloaded, so the result reflects
# the code in the repos.

# This workflow is intended to be invoked only via `workflow_call` (see the
# `e2e` job in go.yml). A previous setup also had `on: push` here, which caused
# every push to main to trigger it TWICE: once from go.yml's `uses:` and once
# from this file's own push trigger. Keeping it `workflow_call`-only means there
# is a single, unambiguous entry point.

on:
  # Allow manual / API dispatch so the e2e result can be inspected on its own,
  # independent of the unit-test job in go.yml.
  workflow_dispatch:
    inputs:
      go_ref:
        description: "tlsvpn ref to build (branch/tag/SHA; default: current checkout)"
        type: string
        required: false
        default: ""
      rs_ref:
        description: "tlsvpn-rs ref to build (branch/tag/SHA; default: default branch)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      go_ref:
        description: "tlsvpn ref to build (branch/tag/SHA; default: current checkout)"
        type: string
        required: false
        default: ""
      rs_ref:
        description: "tlsvpn-rs ref to build (branch/tag/SHA; default: default branch)"
        type: string
        required: false
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Go repo)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.go_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install test deps
        run: |
          sudo apt-get update
          # microsocks provides the SOCKS5 proxy for groups E/F. If the package
          # is unavailable on this runner image, those groups skip gracefully.
          sudo apt-get install -y microsocks 2>/dev/null || echo "microsocks not available — SOCKS5 groups will skip"
          # NOTE: e2e uses the in-memory TAP backend (-tap mem / --tap mem), so no
          # root / CAP_NET_ADMIN / tap kernel module is required to run it.

      - name: Run e2e control groups (build both implementations from source)
        env:
          E2E_GO_REF: "${{ inputs.go_ref }}"
          E2E_RS_REF: "${{ inputs.rs_ref }}"
        run: |
          chmod +x scripts/*.sh
          bash scripts/e2e_test.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/tlsvpn-test.*/**
          if-no-files-found: ignore
