name: Cross-Implementation E2E

# End-to-end interop tests between the Go (tlsvpn) and Rust (tlsvpn-rs)
# implementations. Both are fetched from their repositories and built from
# source on the runner, then exercised as control groups: self-self
# (Go<->Go, Rust<->Rust) and cross-language (Go-server<->Rust-client,
# Rust-server<->Go-client) plus a SOCKS5 client group. Pre-compiled release
# binaries are never downloaded, so the result reflects the code in the repos.

# This workflow is intended to be invoked only via `workflow_call` (see the
# `e2e` job in go.yml). A previous setup also had `on: push` here, which caused
# every push to main to trigger it TWICE: once from go.yml's `uses:` and once
# from this file's own push trigger. Keeping it `workflow_call`-only means there
# is a single, unambiguous entry point.

on:
  # Allow manual / API dispatch so the e2e result can be inspected on its own,
  # independent of the unit-test job in go.yml (which currently fails on CI
  # for linux-only/network reasons). This does NOT auto-trigger on push.
  workflow_dispatch:
    inputs:
      go_ref:
        description: "tlsvpn ref to build (branch/tag/SHA; default: default branch)"
        type: string
        required: false
        default: ""
      rs_ref:
        description: "tlsvpn-rs ref to build (branch/tag/SHA; default: default branch)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      go_ref:
        description: "tlsvpn ref to build (branch/tag/SHA; default: default branch)"
        type: string
        required: false
        default: ""
      rs_ref:
        description: "tlsvpn-rs ref to build (branch/tag/SHA; default: default branch)"
        type: string
        required: false
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Go repo)
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'   # go.mod 声明 go 1.26；stable 避免隐式 toolchain 下载

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install test deps
        run: |
          sudo apt-get update
          # microsocks provides the SOCKS5 proxy for groups E/F. If the package
          # is unavailable on this runner image, those groups skip gracefully.
          sudo apt-get install -y microsocks 2>/dev/null || echo "microsocks not available — SOCKS5 groups will skip"
          # NOTE: e2e uses the in-memory TAP backend (-tap mem / --tap mem), so no
          # root / CAP_NET_ADMIN / tap kernel module is required to run it.

      - name: Run e2e control groups (build both implementations from source)
        env:
          # No *_SRC override: Go is built from this checkout's own tree
          # (cloned at go_ref only when go_ref is given), Rust is cloned at
          # rs_ref. Pointing E2E_GO_SRC / E2E_RS_SRC at an existing directory
          # would skip the clone AND ignore the matching ref, so do not set it
          # here while the inputs are meant to be honoured.
          E2E_GO_REF: "${{ github.event.inputs.go_ref || '' }}"
          E2E_RS_REF: "${{ github.event.inputs.rs_ref || '' }}"
        run: |
          chmod +x scripts/*.sh
          bash scripts/e2e_test.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/tlsvpn-test.*/**
          if-no-files-found: ignore
