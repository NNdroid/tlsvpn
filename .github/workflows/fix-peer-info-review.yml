name: Validate peer info review fixes
on:
  push:
    branches:
      - feat/peer-info-handshake
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/peer-info-handshake
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Apply review fix
        run: python3 scripts/fix_peer_info_review.py
      - name: Validate
        run: |
          gofmt -w client.go peer_info.go peer_info_test.go
          node --check webui/app.js
          go test ./...
      - name: Commit implementation
        run: |
          rm -f .github/workflows/fix-peer-info-review.yml scripts/fix_peer_info_review.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(protocol): harden optional peer metadata handling"
          git push origin HEAD:feat/peer-info-handshake
