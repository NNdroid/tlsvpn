name: Go Tests and Benchmark

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-bench:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'   # go.mod 声明 go 1.26；stable 避免隐式 toolchain 下载

    - name: Build
      run: go build -v ./...

    - name: Cross-build ARM64 v8.2
      run: GOOS=linux GOARCH=arm64 GOARM64=v8.2 CGO_ENABLED=0 go build ./...

    - name: Vet
      run: go vet -v ./...

    # NOTE: project is linux-only; vet/build on the host OS may fail for
    # linux-specific syscalls. Run vet under GOOS=linux to catch real issues.
    - name: Vet (linux target)
      run: GOOS=linux go vet ./...

    - name: Validate OpenWrt netifd/LuCI integration
      run: bash tests/test_openwrt_integration.sh

    - name: Test Core Logic (go test -v)
      # NOTE: some tests (net_linux_test.go socket-mark / proxy_test.go dial
      # tests) exercise live networking and are flaky on hosted CI runners.
      # Allow them to fail without blocking the build/e2e signal; the
      # cross-language golden-vector contract below remains a hard gate.
      continue-on-error: true
      run: go test -v ./...

    - name: Deterministic crypto/FEC core (hard gate)
      # These tests are pure logic/in-memory and must never be softened by the
      # hosted-runner networking exceptions in the full-suite step above.
      run: go test -count=1 ./... -run 'TestFEC|TestGCM|TestFrameGCM'

    - name: "Race detector (FEC/GCM hard gate)"
      # FEC/GCM are session-global hot paths touched concurrently by multiple
      # physical connections; a race here is a correctness failure.
      run: go test -race -count=1 ./... -run 'TestFEC|TestGCM|TestFrameGCM'

    - name: "Race detector (web, ban, stats soft signal)"
      # These suites include hosted-runner/network-sensitive cases. Keep them
      # visible without allowing that flakiness to hide crypto/FEC regressions.
      continue-on-error: true
      run: go test -race ./... -run 'TestWeb|TestStats|TestBan|TestControl|TestMetrics'

    - name: Verify protocol golden vectors (cross-language contract)
      run: go test -v -run 'TestProtocol|TestGenerateGoldenVectors' ./...

    - name: Benchmark (full suite, deterministic run count)
      # -bench=. runs every benchmark incl. GCM/FEC; -count=5 gives
      # benchstat-compatible samples instead of a single noisy number.
      continue-on-error: true
      run: go test -bench . -run '^$' -benchmem -count=5 -timeout 20m | tee bench.txt

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: bench-results
        path: bench.txt
        retention-days: 30

    - name: Profile (CPU + heap via go test -cpuprofile/-memprofile)
      # Reuses the in-process perf harness (real tunnel pipeline). Produces
      # pprof profiles; flame graphs can be viewed locally with
      # `go tool pprof -http=:8080 cpu.prof` after downloading the artifact.
      # Soft-fail like the benchmark step above: this is an artifact producer,
      # not a correctness gate, and it comes last in the job, right after the
      # -count=5 benchmark, so the harness can time out on a contended runner.
      # The golden-vector contract above and the e2e job remain hard gates.
      continue-on-error: true
      run: |
        go test -run TestPerfThroughput -count=1 -timeout 10m \
          -cpuprofile cpu.prof -memprofile mem.prof ./...
        go tool pprof -top -nodecount=25 cpu.prof | tee cpu-top.txt
        go tool pprof -top -nodecount=25 mem.prof | tee mem-top.txt

    - name: Render SVG graphs (flame/call graph, needs graphviz)
      if: always()
      continue-on-error: true
      run: |
        command -v dot >/dev/null 2>&1 || sudo apt-get install -y graphviz
        go tool pprof -svg cpu.prof > cpu-callgraph.svg 2>/dev/null || true
        go tool pprof -alloc_objects -svg mem.prof > mem-allocs.svg 2>/dev/null || true

    - name: Upload profile artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: profiles
        path: |
          cpu.prof
          mem.prof
          cpu-callgraph.svg
          mem-allocs.svg
          cpu-top.txt
          mem-top.txt
        retention-days: 14

  e2e:
    # Run e2e independently of the unit-test job so a pre-existing
    # linux-only/network test failure does not block the integration run.
    # The Go side is built from this repo's checkout; the Rust side is cloned
    # from its default branch and built as well.
    uses: ./.github/workflows/e2e.yml
