name: Go Tests and Benchmark

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-bench:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build
      run: go build -v ./...

    - name: Test Core Logic
      run: go test -v ./...

    - name: Benchmark Protocol
      run: go test -bench=BenchmarkProtocolThroughput -run=^$ -benchmem -v
