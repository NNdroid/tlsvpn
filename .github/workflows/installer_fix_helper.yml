name: Installer regression fix helper

on:
  push:
    branches:
      - fix/installer-os-release-version

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Apply installer fix
        run: python3 .installer_fix.py
      - name: Validate
        run: |
          bash -n scripts/install.sh
          bash scripts/test_install.sh
          gofmt -w installer_script_test.go
          go test ./... -run 'TestInstallScriptContract' -count=1
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/install.sh scripts/test_install.sh installer_script_test.go
          git commit -m 'fix(installer): isolate os-release version variables'
          git push origin HEAD:fix/installer-os-release-version
