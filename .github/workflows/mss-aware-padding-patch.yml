name: Apply MSS-aware padding patch

on:
  push:
    branches:
      - perf/mss-aware-padding-20260928

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Apply source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          # frame.go: make padding helpers accept an optional per-connection
          # record ceiling while preserving all existing call sites/tests.
          replace_once('frame.go',
          '''func appendOwnedFrameBatch(sendBuffer []byte, frames []VPNFrame, ic *innerCipher) ([]byte, int, uint64) {
          \tn := len(frames)
          \tvar pad uint64
          \tfor _, vf := range frames {
          \t\tvar p int
          \t\tsendBuffer, p = appendPaddedFrame(sendBuffer, vf, ic)
          ''',
          '''func appendOwnedFrameBatch(sendBuffer []byte, frames []VPNFrame, ic *innerCipher, recordLimit ...int) ([]byte, int, uint64) {
          \tn := len(frames)
          \tlimit := 0
          \tif len(recordLimit) > 0 {
          \t\tlimit = recordLimit[0]
          \t}
          \tvar pad uint64
          \tfor _, vf := range frames {
          \t\tvar p int
          \t\tsendBuffer, p = appendPaddedFrame(sendBuffer, vf, ic, limit)
          ''')

          replace_once('frame.go',
          '''func currentPadLength(wireLen int) int {
          \tif padModeCode.Load() == padCodeOff {
          \t\treturn 0
          \t}
          \treturn padBucket(wireLen)
          }
          ''',
          '''func currentPadLength(wireLen int, recordLimit ...int) int {
          \tif padModeCode.Load() == padCodeOff {
          \t\treturn 0
          \t}
          \tlimit := 0
          \tif len(recordLimit) > 0 {
          \t\tlimit = recordLimit[0]
          \t}
          \treturn padBucket(wireLen, limit)
          }
          ''')

          replace_once('frame.go',
          '''// padBucket 小帧填充到固定桶；超出最大桶的大帧（jumbo）只加小额随机填充，
          // 避免为抗流量分析付出过大带宽代价。
          func padBucket(wireLen int) int {
          \trecordLen := 10 + wireLen
          \tfor _, b := range padBuckets {
          \t\t// 使用严格小于保证 bucket 模式的每条记录都有非零 padding；off 是
          \t\t// 唯一允许零填充的模式，测试和运维语义不再含糊。
          \t\tif recordLen < b {
          \t\t\treturn b - recordLen
          \t\t}
          \t}
          \treturn 1 + mathrand.IntN(100)
          }
          ''',
          '''// padBucket 小帧填充到固定桶。recordLimit>0 时启用 MSS-aware 上限：
          // 静态桶超过上限时把上限本身当作最后一个动态桶；记录已经达到/超过
          // 上限时不再追加 padding，避免混淆填充主动制造额外 TCP segmentation。
          // recordLimit==0 保留历史行为，供纯协议测试与无 socket 场景使用。
          func padBucket(wireLen int, recordLimit ...int) int {
          \trecordLen := 10 + wireLen
          \tlimit := 0
          \tif len(recordLimit) > 0 {
          \t\tlimit = recordLimit[0]
          \t}
          \tif limit > 0 && recordLen >= limit {
          \t\treturn 0
          \t}
          \tfor _, b := range padBuckets {
          \t\ttarget := b
          \t\tif limit > 0 && target > limit {
          \t\t\ttarget = limit
          \t\t}
          \t\tif recordLen < target {
          \t\t\treturn target - recordLen
          \t\t}
          \t\tif limit > 0 && b >= limit {
          \t\t\treturn 0
          \t\t}
          \t}
          \tif limit > 0 {
          \t\treturn 0
          \t}
          \treturn 1 + mathrand.IntN(100)
          }
          ''')

          replace_once('frame.go',
          '''func appendPaddedFrame(buf []byte, vf VPNFrame, ic *innerCipher) ([]byte, int) {
          \tdataLen := len(vf.Data)
          ''',
          '''func appendPaddedFrame(buf []byte, vf VPNFrame, ic *innerCipher, recordLimit ...int) ([]byte, int) {
          \tdataLen := len(vf.Data)
          ''')
          replace_once('frame.go',
          '''\twireLen := dataLen + encTag
          \tpadLen := currentPadLength(wireLen)
          ''',
          '''\twireLen := dataLen + encTag
          \tpadLen := currentPadLength(wireLen, recordLimit...)
          ''')

          replace_once('frame.go',
          '''func writeStreamFrame(w io.Writer, frame []byte) error {
          \tstreamBuf := getFrame()[:0]
          \tstreamBuf, pad := appendPaddedFrame(streamBuf, VPNFrame{Seq: 0, Data: frame}, nil)
          ''',
          '''func writeStreamFrame(w io.Writer, frame []byte, recordLimit ...int) error {
          \tstreamBuf := getFrame()[:0]
          \tstreamBuf, pad := appendPaddedFrame(streamBuf, VPNFrame{Seq: 0, Data: frame}, nil, recordLimit...)
          ''')

          # Linux TCP_MAXSEG observation + portable stub.
          replace_once('net_linux.go',
          '''func startRTTPoller(ctx context.Context, conn *net.TCPConn, rttCache *uint32) {
          ''',
          '''func getTCPMSS(conn *net.TCPConn) (int, error) {
          \tif conn == nil {
          \t\treturn 0, fmt.Errorf("no raw TCP connection available (proxied?)")
          \t}
          \traw, err := conn.SyscallConn()
          \tif err != nil {
          \t\treturn 0, err
          \t}
          \tvar mss int
          \tvar sysErr error
          \terr = raw.Control(func(fd uintptr) {
          \t\tmss, sysErr = unix.GetsockoptInt(int(fd), unix.IPPROTO_TCP, unix.TCP_MAXSEG)
          \t})
          \tif err != nil {
          \t\treturn 0, err
          \t}
          \treturn mss, sysErr
          }

          func startRTTPoller(ctx context.Context, conn *net.TCPConn, rttCache *uint32) {
          ''')
          replace_once('tap_other.go',
          '''func getTCPRTT(conn *net.TCPConn) (uint32, error) {
          \treturn 0, fmt.Errorf("TCP RTT probing is only supported on Linux")
          }

          func startRTTPoller''',
          '''func getTCPRTT(conn *net.TCPConn) (uint32, error) {
          \treturn 0, fmt.Errorf("TCP RTT probing is only supported on Linux")
          }

          func getTCPMSS(conn *net.TCPConn) (int, error) {
          \treturn 0, fmt.Errorf("TCP MSS probing is only supported on Linux")
          }

          func startRTTPoller''')

          # Client: compute one connection-local padding limit from the effective
          # MSS and thread it through handshake/data/keepalive framing.
          replace_once('client.go',
          '''\t// tcpConn 仅用于端到端语义的内核调优（Brutal/RTT）；代理模式下为 nil 并自动跳过
          \ttcpConn := asTCPConn(rawConn)

          \t// 握手声明''',
          '''\t// tcpConn 仅用于端到端语义的内核调优（Brutal/RTT）；代理模式下为 nil 并自动跳过
          \ttcpConn := asTCPConn(rawConn)
          \tpadRecordLimit := paddingRecordLimit(tcpConn)

          \t// 握手声明''')
          replace_once('client.go',
          '''\terr = writeStreamFrame(tlsConn, reqData)
          ''',
          '''\terr = writeStreamFrame(tlsConn, reqData, padRecordLimit)
          ''')
          replace_once('client.go',
          '''\t\t\t\t\tsendBuffer, n, p = appendOwnedFrameBatch(sendBuffer, frames, icTx)
          ''',
          '''\t\t\t\t\tsendBuffer, n, p = appendOwnedFrameBatch(sendBuffer, frames, icTx, padRecordLimit)
          ''')
          replace_once('client.go',
          '''\t\t\t\tsendBuffer, _ = appendPaddedFrame(sendBuffer, VPNFrame{Seq: 0, Data: nil}, nil)
          ''',
          '''\t\t\t\tsendBuffer, _ = appendPaddedFrame(sendBuffer, VPNFrame{Seq: 0, Data: nil}, nil, padRecordLimit)
          ''')

          # Server: same per-connection ceiling. sendResp is variadic so all
          # existing tests/callers remain source-compatible.
          replace_once('server.go',
          '''\tdefer cancel()
          \tdefer conn.Close()

          \tscanner := NewFrameScanner(conn)
          ''',
          '''\tdefer cancel()
          \tdefer conn.Close()
          \tpadRecordLimit := paddingRecordLimit(tcpConn)

          \tscanner := NewFrameScanner(conn)
          ''')
          replace_once('server.go',
          '''\t\treq.FEC, uint32(fecEncK), encAlgo, encSalt, encSalt2, resumeToken, sessionEncrypt, req.ProtocolVersion, sessionEpoch, tlsInfo)
          ''',
          '''\t\treq.FEC, uint32(fecEncK), encAlgo, encSalt, encSalt2, resumeToken, sessionEncrypt, req.ProtocolVersion, sessionEpoch, tlsInfo, padRecordLimit)
          ''')
          replace_once('server.go',
          '''\t\t\t\t\tsendBuffer, n, p = appendOwnedFrameBatch(sendBuffer, frames, icTx)
          ''',
          '''\t\t\t\t\tsendBuffer, n, p = appendOwnedFrameBatch(sendBuffer, frames, icTx, padRecordLimit)
          ''')
          replace_once('server.go',
          '''\t\t\t\tsendBuffer, _ = appendPaddedFrame(sendBuffer, VPNFrame{Seq: 0, Data: nil}, nil)
          ''',
          '''\t\t\t\tsendBuffer, _ = appendPaddedFrame(sendBuffer, VPNFrame{Seq: 0, Data: nil}, nil, padRecordLimit)
          ''')
          replace_once('server.go',
          '''\ttlsInfo *TLSHandshakeInfo) error {
          ''',
          '''\ttlsInfo *TLSHandshakeInfo, padRecordLimit ...int) error {
          ''')
          replace_once('server.go',
          '''\tif err := writeStreamFrame(w, d); err != nil {
          ''',
          '''\tif err := writeStreamFrame(w, d, padRecordLimit...); err != nil {
          ''')
          PY

          gofmt -w frame.go net_linux.go tap_other.go client.go server.go padding_mss.go padding_mss_test.go

      - name: Test
        run: |
          go test ./...
          go test -race ./... -run 'TestPadBucketRespectsMSSLimit|TestPaddingRecordLimitForMSS|TestFEC|TestInner'

      - name: Commit final source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mss-aware-padding-patch.yml
          git add -A
          git commit -m 'perf: make bucket padding MSS-aware'
          git push origin HEAD:perf/mss-aware-padding-20260928
