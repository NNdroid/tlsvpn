name: Dataplane perf patch

on:
  push:
    branches:
      - perf/dataplane-hotpath-20260928
    paths:
      - scripts/perf_opt_patch.py
      - .github/workflows/perf-opt-patch.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/perf_opt_patch.py
      - .github/workflows/perf-opt-patch.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/dataplane-hotpath-20260928
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Apply patch
        run: python3 scripts/perf_opt_patch.py

      - name: Format
        run: gofmt -w client.go fec.go fec_test.go

      - name: Unit tests
        run: go test ./...

      - name: Race tests for dataplane state
        run: go test -race ./... -run 'TestFEC|TestReorder|TestAsyncPort|TestDeDup'

      - name: Protocol benchmarks smoke test
        run: go test -run '^$' -bench 'Benchmark(FEC|GCM)' -benchtime=250ms ./...

      - name: Commit optimized dataplane
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client.go fec.go fec_test.go
          git commit -m "perf: reduce Go dataplane hot-path overhead"
          git push origin HEAD:perf/dataplane-hotpath-20260928
