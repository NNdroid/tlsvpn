name: Port Go installer

on:
  push:
    branches: [ "feat/go-installer" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Generate and polish Go installer
        run: |
          python3 .github/scripts/port_go_installer.py
          python3 .github/scripts/polish_go_installer.py
          chmod +x scripts/install.sh

      - name: Validate installer
        run: |
          bash -n scripts/install.sh
          bash scripts/install.sh help | grep -Fq 'tlsvpn Go installer'
          bash scripts/install.sh help | grep -Fq -- '--arch auto|amd64|386|arm64|arm64-v8.2|arm|armv7|mipsle|mips'
          bash scripts/install.sh help | grep -Fq -- '--cert-mode lego|self-signed|existing'
          ! bash scripts/install.sh help | grep -Fq -- '--cert-mode lego|self-signed|existing|none'
          grep -Fq 'tlsvpn_linux_arm64_v8.2' scripts/install.sh
          grep -Fq '"traffic_days": 30' scripts/install.sh
          grep -Fq 'web_addr_is_loopback' scripts/install.sh
          grep -Fq 'Would install daily TLSVPN maintenance task' scripts/install.sh
          ! grep -Eq 'tlsvpn-rs|unknown-linux-musl|"workers"|"mtu"' scripts/install.sh
          git diff --check
          go test ./... -run TestInstallScriptContract -count=1

      - name: Commit generated installer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/install.sh installer_script_test.go README.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'feat: harden one-click Go installer'
          git push origin HEAD:feat/go-installer
