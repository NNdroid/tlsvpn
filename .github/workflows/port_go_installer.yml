name: Port Go installer

on:
  push:
    branches: [ "feat/go-installer" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Generate Go installer from validated Rust installer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import urllib.request

          url = 'https://raw.githubusercontent.com/NNdroid/tlsvpn-rs/main/scripts/install.sh'
          s = urllib.request.urlopen(url, timeout=30).read().decode()

          def one(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected one match, got {n}: {old[:80]!r}')
              s = s.replace(old, new, 1)

          def alln(old, new, n):
              global s
              got = s.count(old)
              if got != n:
                  raise SystemExit(f'expected {n} matches, got {got}: {old[:80]!r}')
              s = s.replace(old, new)

          one('# tlsvpn-rs one-click installer / upgrader', '# tlsvpn Go one-click installer / upgrader')
          one('REPO="NNdroid/tlsvpn-rs"', 'REPO="NNdroid/tlsvpn"')
          one('WORKERS="0"\nMTU="1500"\n', '')
          one('tlsvpn-rs installer', 'tlsvpn Go installer')
          one('--arch auto|amd64|arm64|armv7|arm64-a55', '--arch auto|amd64|386|arm64|arm64-v8.2|arm|armv7|mipsle|mips')
          one('  --workers N                   Rust server worker count; 0 = automatic.\n  --mtu N                       TAP MTU, 576..9000.\n', '')
          one('      --workers) need_arg "$@"; WORKERS="$2"; shift ;;\n      --mtu) need_arg "$@"; MTU="$2"; shift ;;\n', '')
          one('  [[ "$WORKERS" =~ ^[0-9]+$ ]] || die "--workers must be a non-negative integer"\n  [[ "$MTU" =~ ^[0-9]+$ ]] && (( MTU >= 576 && MTU <= 9000 )) || die "--mtu must be in [576, 9000]"\n', '')
          one('TLSVPN-RS Setup Wizard', 'TLSVPN Go Setup Wizard')

          one('''  case "$(uname -m)" in
    x86_64|amd64) HOST_ARCH="amd64" ;;
    aarch64|arm64) HOST_ARCH="arm64" ;;
    armv7l|armv7*) HOST_ARCH="armv7" ;;
    *) die "Unsupported CPU architecture: $(uname -m)" ;;
  esac
}''', '''  case "$(uname -m)" in
    x86_64|amd64) HOST_ARCH="amd64" ;;
    i386|i486|i586|i686) HOST_ARCH="386" ;;
    aarch64|arm64) HOST_ARCH="arm64" ;;
    armv6l|armv7l|armv7*) HOST_ARCH="arm" ;;
    mipsel|mipsle) HOST_ARCH="mipsle" ;;
    mips) HOST_ARCH="mips" ;;
    *) die "Unsupported CPU architecture: $(uname -m)" ;;
  esac
}''')

          old_release = '''release_arch() {
  local want="$ARCH"
  [[ "$want" == "auto" ]] && want="$HOST_ARCH"
  case "$want" in
    amd64) RELEASE_ASSET="tlsvpn-x86_64-unknown-linux-musl" ;;
    arm64) RELEASE_ASSET="tlsvpn-aarch64-unknown-linux-musl" ;;
    arm64-a55) [[ "$HOST_ARCH" == "arm64" ]] || die "arm64-a55 can only run on ARM64"; RELEASE_ASSET="tlsvpn-aarch64-unknown-linux-musl-cortex-a55" ;;
    armv7) RELEASE_ASSET="tlsvpn-armv7-unknown-linux-musleabihf" ;;
    *) die "Unsupported --arch: $want" ;;
  esac
}'''
          new_release = '''release_arch() {
  local want="$ARCH"
  [[ "$want" == "auto" ]] && want="$HOST_ARCH"
  case "$want" in
    amd64) RELEASE_ASSET="tlsvpn_linux_amd64" ;;
    386) RELEASE_ASSET="tlsvpn_linux_386" ;;
    arm64) RELEASE_ASSET="tlsvpn_linux_arm64" ;;
    arm64-v8.2) [[ "$HOST_ARCH" == "arm64" ]] || die "arm64-v8.2 can only run on ARM64"; RELEASE_ASSET="tlsvpn_linux_arm64_v8.2" ;;
    arm|armv7) RELEASE_ASSET="tlsvpn_linux_arm" ;;
    mipsle) RELEASE_ASSET="tlsvpn_linux_mipsle" ;;
    mips) RELEASE_ASSET="tlsvpn_linux_mips" ;;
    *) die "Unsupported --arch: $want" ;;
  esac
}'''
          one(old_release, new_release)

          one('case "$HOST_ARCH" in amd64) lego_arch="amd64";; arm64) lego_arch="arm64";; armv7) lego_arch="armv7";; esac',
              'case "$HOST_ARCH" in amd64) lego_arch="amd64";; 386) lego_arch="386";; arm64) lego_arch="arm64";; arm) lego_arch="armv7";; *) die "Automatic lego installation is unsupported on architecture $HOST_ARCH; use --cert-mode self-signed or existing.";; esac')

          one('  local psk webauth cert key addr\n  psk="$(json_escape "$PSK")"; webauth="$(json_escape "$WEB_AUTH")"',
              '  local psk webauth cert key addr traffic\n  psk="$(json_escape "$PSK")"; webauth="$(json_escape "$WEB_AUTH")"; traffic="$(json_escape "$CONFIG_DIR/tlsvpn-traffic.json")"')
          alln('  "brutal_down": 500,\n', '  "brutal_down": 500,\n  "traffic_days": 30,\n  "traffic_file": "$traffic",\n', 2)
          alln('  "workers": $WORKERS,\n  "mtu": $MTU,\n', '', 2)

          s = s.replace('TLSVPN Rust Layer-2 VPN', 'TLSVPN Go Layer-2 VPN')
          s = s.replace('# Managed by tlsvpn-rs scripts/install.sh', '# Managed by tlsvpn Go scripts/install.sh')

          one('''  local before=""
  [[ -x "$INSTALL_DIR/$PROGRAM" ]] && before="$($INSTALL_DIR/$PROGRAM --version 2>/dev/null || true)"''', '''  local before=""
  [[ -r "$STATE_DIR/installed-version" ]] && before="$(cat "$STATE_DIR/installed-version")"''')

          old_backup = re.search(r'create_backup\(\) \{.*?\n\}\n\nrestore_backup\(\)', s, re.S)
          if not old_backup:
              raise SystemExit('create_backup function not found')
          new_backup = '''create_backup() {
  local id; id="$(date -u +%Y%m%dT%H%M%SZ)-$$"
  CURRENT_BACKUP="$id"
  info "Backup snapshot: $id"
  if [[ "$DRY_RUN" == "yes" ]]; then return 0; fi
  mkdir -p "$BACKUP_DIR"
  local dir="$BACKUP_DIR/$id"
  mkdir -p "$dir/root"
  local p
  local paths=(
    "$INSTALL_DIR/$PROGRAM" "$CONFIG_FILE" "$CERT_DIR" "$SYSTEMD_SERVICE"
    "$SYSTEMD_MAINT_SERVICE" "$SYSTEMD_MAINT_TIMER" "$OPENRC_SERVICE" "$ALPINE_DAILY"
    "$SYSCTL_FILE" "$STATE_FILE" "$INSTALLER_COPY"
  )
  : >"$dir/manifest"
  : >"$dir/absent"
  for p in "${paths[@]}"; do
    if [[ -e "$p" || -L "$p" ]]; then
      printf '%s\\n' "$p" >>"$dir/manifest"
      mkdir -p "$dir/root$(dirname "$p")"
      cp -a "$p" "$dir/root$p"
    else
      printf '%s\\n' "$p" >>"$dir/absent"
    fi
  done
}

restore_backup()'''
          s = s[:old_backup.start()] + new_backup + s[old_backup.end():]

          one('''  if [[ -z "$id" ]]; then id="$(find "$BACKUP_DIR" -mindepth 1 -maxdepth 1 -type d -printf '%f\\n' 2>/dev/null | sort | tail -n1)"; fi''', '''  if [[ -z "$id" ]]; then
    id="$(for d in "$BACKUP_DIR"/*; do [[ -d "$d" ]] && basename "$d"; done 2>/dev/null | sort | tail -n1)"
  fi''')

          if 'tlsvpn-rs' in s or 'TLSVPN-RS' in s or '"workers"' in s or '"mtu"' in s:
              bad = [x for x in ('tlsvpn-rs','TLSVPN-RS','"workers"','"mtu"') if x in s]
              raise SystemExit(f'Rust-only markers remain: {bad}')

          Path('scripts/install.sh').write_text(s)

          test = r'''package main

import (
    "os"
    "strings"
    "testing"
)

func TestInstallScriptContract(t *testing.T) {
    b, err := os.ReadFile("scripts/install.sh")
    if err != nil { t.Fatal(err) }
    s := string(b)
    wants := []string{
        `REPO="NNdroid/tlsvpn"`,
        `tlsvpn_linux_amd64`, `tlsvpn_linux_386`, `tlsvpn_linux_arm64`,
        `tlsvpn_linux_arm64_v8.2`, `tlsvpn_linux_arm`, `tlsvpn_linux_mipsle`, `tlsvpn_linux_mips`,
        `install|upgrade|uninstall|rollback|maintenance|status|help`,
        `--cert-mode lego|self-signed|existing|none`, `--profile shortlived`,
        `--renew-days 2`, `--renew-days 30`, `lego migrate --path`,
        `OnCalendar=daily`, `/etc/periodic/daily/tlsvpn-maintenance`,
        `--xanmod yes|no`, `--tcp-brutal yes|no`, `--optimize-kernel yes|no`,
        `"traffic_days": 30`, `"traffic_file": "$traffic"`,
        `debian|ubuntu`, `rocky|rhel|almalinux|centos|fedora`, `alpine`,
        `Type "back" at any prompt`, `ROLLBACK_ON_ERROR="yes"`,
    }
    for _, want := range wants {
        if !strings.Contains(s, want) { t.Fatalf("install.sh missing %q", want) }
    }
    for _, bad := range []string{`NNdroid/tlsvpn-rs`, `tlsvpn-rs installer`, `"workers"`, `"mtu"`, `unknown-linux-musl`} {
        if strings.Contains(s, bad) { t.Fatalf("install.sh still contains Rust-only marker %q", bad) }
    }
}
'''
          Path('installer_script_test.go').write_text(test)

          readme = Path('README.md').read_text()
          marker = '\n## Configuration Reference\n'
          if marker not in readme:
              raise SystemExit('README insertion marker missing')
          section = r'''
## One-click installer

`scripts/install.sh` provides an English interactive wizard and a fully flag-driven mode for Debian, Ubuntu, Rocky/RHEL-family and Alpine Linux. It can install, upgrade, uninstall, roll back, show status and run daily maintenance. Server certificates can be issued by lego/ACME for either a DNS name or a public IP identifier, generated locally as self-signed certificates, or copied from an existing pair. Optional components include XanMod on supported Debian/Ubuntu x86_64 hosts, tcp-brutal DKMS and conservative network sysctl tuning.

```bash
sudo bash scripts/install.sh
sudo bash scripts/install.sh install --mode server --psk '...' --cert-mode lego \
  --cert-name vpn.example.com --email admin@example.com --daily-update yes
sudo bash scripts/install.sh install --mode server --psk '...' --cert-mode lego \
  --cert-name 203.0.113.10 --email admin@example.com
sudo bash scripts/install.sh install --mode client --server vpn.example.com:4000 --psk '...' \
  --tcp-brutal yes --optimize-kernel yes
sudo bash scripts/install.sh upgrade
sudo bash scripts/install.sh rollback
sudo bash scripts/install.sh uninstall --purge
```

The installer stores rollback snapshots under `/var/lib/tlsvpn-installer`, installs a systemd timer or Alpine daily periodic task when daily maintenance is enabled, and keeps optional kernel components non-fatal so a XanMod or tcp-brutal failure does not destroy an otherwise working TLSVPN installation. Use `scripts/install.sh help` for every flag.
'''
          if '## One-click installer' not in readme:
              readme = readme.replace(marker, '\n' + section + marker, 1)
              Path('README.md').write_text(readme)
          PY
          chmod +x scripts/install.sh

      - name: Validate installer shell and documentation contract
        run: |
          bash -n scripts/install.sh
          bash scripts/install.sh help | grep -Fq 'tlsvpn Go installer'
          bash scripts/install.sh help | grep -Fq -- '--arch auto|amd64|386|arm64|arm64-v8.2|arm|armv7|mipsle|mips'
          grep -Fq 'tlsvpn_linux_arm64_v8.2' scripts/install.sh
          grep -Fq '"traffic_days": 30' scripts/install.sh
          ! grep -Eq 'tlsvpn-rs|unknown-linux-musl|"workers"|"mtu"' scripts/install.sh
          git diff --check
          go test ./... -run TestInstallScriptContract -count=1

      - name: Commit generated installer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/install.sh installer_script_test.go README.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'feat: add one-click Go installer'
          git push origin HEAD:feat/go-installer
