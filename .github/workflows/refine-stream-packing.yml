name: Refine persistent stream packing

on:
  push:
    branches:
      - perf/persistent-stream-packing-20260929
    paths:
      - scripts/refine_stream_packing.py
      - .github/workflows/refine-stream-packing.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/persistent-stream-packing-20260929
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply carry-tail refinement
        run: python3 scripts/refine_stream_packing.py
      - name: Format
        run: gofmt -w client.go server.go stream_padding.go persistent_stream_test.go
      - name: Test
        run: |
          go test ./...
          go test -race ./... -run 'TestPersistentStream|TestSparseMTU|TestStream|TestFrame|TestOwned'
      - name: Remove temporary helpers
        run: rm -f scripts/refine_stream_packing.py .github/workflows/refine-stream-packing.yml
      - name: Commit final source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: carry sub-MSS stream tail across batches'
          git push origin HEAD:perf/persistent-stream-packing-20260929
