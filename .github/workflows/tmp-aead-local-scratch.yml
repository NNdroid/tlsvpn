name: Temporary AEAD local scratch optimization

on:
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'perf/single-path-fec-bypass'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/single-path-fec-bypass
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Baseline AEAD microbench
        if: ${{ !contains(github.event.head_commit.message || '', 'aead: use goroutine-local nonce scratch') }}
        run: |
          go test -run '^$' -bench 'Benchmark(GCMSealOpen|GCM128SealOpen|ChaCha20Poly1305SealOpen|XChaCha20Poly1305SealOpen)$' -benchmem -count=5 . | tee /tmp/aead-before.txt

      - name: Apply P0 local scratch change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected pattern: {label}')
              return text.replace(old, new)

          # crypto.go: remove the shared sync.Pool entirely and expose scratch-aware
          # helpers. Compatibility wrappers use stack-local scratch for cold/tests.
          p = 'crypto.go'
          s = read(p)
          if 'aeadScratchPool' in s:
              s = must_replace(s, '\t"sync"\n', '', 'crypto sync import')
              s = must_replace(
                  s,
                  'var aeadScratchPool = sync.Pool{New: func() any { return new(nonceAADScratch) }}\n\n',
                  '',
                  'AEAD scratch pool',
              )
              pattern = re.compile(
                  r'func \(ic \*innerCipher\) sealInPlace\(region \[\]byte, ptLen int, seq uint32, wireLen uint32\) int \{.*?\n\}\n\n'
                  r'func \(ic \*innerCipher\) openInPlace\(data \[\]byte, seq uint32, wireLen uint32\) \(\[\]byte, error\) \{.*?\n\}\n\n'
                  r'func \(ic \*innerCipher\) openTo\(dst, src \[\]byte, seq uint32, wireLen uint32\) \(\[\]byte, error\) \{.*?\n\}\n',
                  re.S,
              )
              replacement = '''func (ic *innerCipher) sealInPlaceWithScratch(region []byte, ptLen int, seq uint32, wireLen uint32, scratch *nonceAADScratch) int {
	if ptLen == 0 || ic == nil {
		return ptLen
	}
	nonce, aad := ic.nonceAAD(seq, wireLen, scratch)
	out := ic.aead.Seal(region[:0], nonce, region[:ptLen], aad)
	return len(out)
}

func (ic *innerCipher) sealInPlace(region []byte, ptLen int, seq uint32, wireLen uint32) int {
	var scratch nonceAADScratch
	return ic.sealInPlaceWithScratch(region, ptLen, seq, wireLen, &scratch)
}

func (ic *innerCipher) openInPlaceWithScratch(data []byte, seq uint32, wireLen uint32, scratch *nonceAADScratch) ([]byte, error) {
	if len(data) == 0 || ic == nil {
		return data, nil
	}
	if len(data) < ic.tagLen() {
		return nil, fmt.Errorf("AEAD payload too short: %d", len(data))
	}
	nonce, aad := ic.nonceAAD(seq, wireLen, scratch)
	return ic.aead.Open(data[:0], nonce, data, aad)
}

func (ic *innerCipher) openInPlace(data []byte, seq uint32, wireLen uint32) ([]byte, error) {
	var scratch nonceAADScratch
	return ic.openInPlaceWithScratch(data, seq, wireLen, &scratch)
}

func (ic *innerCipher) openToWithScratch(dst, src []byte, seq uint32, wireLen uint32, scratch *nonceAADScratch) ([]byte, error) {
	if ic == nil {
		copy(dst, src)
		return dst, nil
	}
	if len(src) < ic.tagLen() {
		return nil, fmt.Errorf("AEAD payload too short: %d", len(src))
	}
	nonce, aad := ic.nonceAAD(seq, wireLen, scratch)
	return ic.aead.Open(dst[:0], nonce, src, aad)
}

func (ic *innerCipher) openTo(dst, src []byte, seq uint32, wireLen uint32) ([]byte, error) {
	var scratch nonceAADScratch
	return ic.openToWithScratch(dst, src, seq, wireLen, &scratch)
}
'''
              s2, n = pattern.subn(replacement, s, count=1)
              if n != 1:
                  raise SystemExit(f'crypto helper replacement count={n}')
              s = s2
              write(p, s)

          # Stream framing: writer goroutine supplies one scratch reused for every
          # frame. Keep old helpers as stack-local compatibility wrappers.
          p = 'stream_padding.go'
          s = read(p)
          if 'appendUnpaddedFrameWithScratch' not in s:
              s = must_replace(
                  s,
                  'func appendUnpaddedFrame(buf []byte, vf VPNFrame, ic *innerCipher) ([]byte, int) {',
                  'func appendUnpaddedFrameWithScratch(buf []byte, vf VPNFrame, ic *innerCipher, scratch *nonceAADScratch) ([]byte, int) {',
                  'appendUnpaddedFrame signature',
              )
              s = must_replace(
                  s,
                  'ic.sealInPlace(buf[payloadStart:payloadStart+wireLen], dataLen, vf.Seq, uint32(wireLen))',
                  'ic.sealInPlaceWithScratch(buf[payloadStart:payloadStart+wireLen], dataLen, vf.Seq, uint32(wireLen), scratch)',
                  'stream seal call',
              )
              marker = '\treturn buf, startIdx\n}\n\nfunc appendOwnedFrameBatchStream('
              insert = '''\treturn buf, startIdx
}

func appendUnpaddedFrame(buf []byte, vf VPNFrame, ic *innerCipher) ([]byte, int) {
	var scratch nonceAADScratch
	return appendUnpaddedFrameWithScratch(buf, vf, ic, &scratch)
}

func appendOwnedFrameBatchStreamWithScratch(buf []byte, frames []VPNFrame, ic *innerCipher, scratch *nonceAADScratch) ([]byte, int, int) {'''
              if marker not in s:
                  raise SystemExit('missing stream batch marker')
              s = s.replace(marker, insert, 1)
              s = must_replace(
                  s,
                  'buf, start = appendUnpaddedFrame(buf, vf, ic)',
                  'buf, start = appendUnpaddedFrameWithScratch(buf, vf, ic, scratch)',
                  'stream batch scratch call',
              )
              batch_end = '\treturn buf, n, last\n}\n\n// streamAlignedTLSPlaintextTarget'
              batch_repl = '''\treturn buf, n, last
}

func appendOwnedFrameBatchStream(buf []byte, frames []VPNFrame, ic *innerCipher) ([]byte, int, int) {
	var scratch nonceAADScratch
	return appendOwnedFrameBatchStreamWithScratch(buf, frames, ic, &scratch)
}

// streamAlignedTLSPlaintextTarget'''
              s = must_replace(s, batch_end, batch_repl, 'stream batch wrapper')
              write(p, s)

          # client/server: each physical TLS connection owns one TX and one RX
          # scratch. The RX scratch is also reused for FEC parity controls.
          for p in ('client.go', 'server.go'):
              s = read(p)
              if 'var txAEADScratch nonceAADScratch' not in s:
                  s = must_replace(
                      s,
                      '\t\tsendBuffer := make([]byte, 0, 64*1024+4096)\n',
                      '\t\tsendBuffer := make([]byte, 0, 64*1024+4096)\n\t\tvar txAEADScratch nonceAADScratch\n',
                      f'{p} writer scratch',
                  )
                  s = s.replace(
                      'appendOwnedFrameBatchStream(sendBuffer, frames, icTx)',
                      'appendOwnedFrameBatchStreamWithScratch(sendBuffer, frames, icTx, &txAEADScratch)',
                  )
              if 'var rxAEADScratch nonceAADScratch' not in s:
                  s = must_replace(
                      s,
                      '\t\tvar rxBytesBatch, rxPacketsBatch uint64\n',
                      '\t\tvar rxBytesBatch, rxPacketsBatch uint64\n\t\tvar rxAEADScratch nonceAADScratch\n',
                      f'{p} reader scratch',
                  )
                  s = re.sub(
                      r'(icRx\.openInPlace)\((frame, seq, uint32\(len\(frame\)\))\)',
                      r'\1WithScratch(\2, &rxAEADScratch)',
                      s,
                  )
                  s = s.replace('c.fecDec.OnControl(frame)', 'c.fecDec.OnControlWithScratch(frame, &rxAEADScratch)')
                  s = s.replace('fecDec.OnControl(frame)', 'fecDec.OnControlWithScratch(frame, &rxAEADScratch)')
              write(p, s)

          # FEC encoder is owned by AsyncPort.run, so it can retain scratch in the
          # encoder. Decoder controls are invoked by connection RX goroutines and
          # receive that goroutine's scratch explicitly.
          p = 'fec.go'
          s = read(p)
          if 'aeadScratch nonceAADScratch' not in s:
              s = must_replace(
                  s,
                  '\tic         *innerCipher\n\tparitySent uint64',
                  '\tic          *innerCipher\n\taeadScratch nonceAADScratch\n\tparitySent  uint64',
                  'fec encoder scratch field',
              )
              s = must_replace(
                  s,
                  'e.ic.sealInPlace(buf[off:off+maxLen+tagLen], maxLen, e.seqs[0], uint32(maxLen+tagLen))',
                  'e.ic.sealInPlaceWithScratch(buf[off:off+maxLen+tagLen], maxLen, e.seqs[0], uint32(maxLen+tagLen), &e.aeadScratch)',
                  'fec encoder seal scratch',
              )

              old = '''func (d *fecDecoder) OnControl(payload []byte) error {
	kind, err := parseControlKind(payload)
	if err != nil {
		return err
	}
	switch kind {
	case controlKindFECParity:
		d.OnParity(payload)
		return nil
'''
              new = '''func (d *fecDecoder) OnControl(payload []byte) error {
	var scratch nonceAADScratch
	return d.OnControlWithScratch(payload, &scratch)
}

func (d *fecDecoder) OnControlWithScratch(payload []byte, scratch *nonceAADScratch) error {
	kind, err := parseControlKind(payload)
	if err != nil {
		return err
	}
	switch kind {
	case controlKindFECParity:
		d.OnParityWithScratch(payload, scratch)
		return nil
'''
              s = must_replace(s, old, new, 'fec OnControl scratch')

              old = '''// OnParity 处理一个校验帧负载。payload 只读借用，不转移所有权。
func (d *fecDecoder) OnParity(payload []byte) {
	if d.staticSingle.Load() || len(payload) < 7 || payload[0] != controlKindFECParity {
'''
              new = '''// OnParity 处理一个校验帧负载。payload 只读借用，不转移所有权。
func (d *fecDecoder) OnParity(payload []byte) {
	var scratch nonceAADScratch
	d.OnParityWithScratch(payload, &scratch)
}

func (d *fecDecoder) OnParityWithScratch(payload []byte, scratch *nonceAADScratch) {
	if d.staticSingle.Load() || len(payload) < 7 || payload[0] != controlKindFECParity {
'''
              s = must_replace(s, old, new, 'fec OnParity scratch')
              s = must_replace(
                  s,
                  'd.ic.openTo(pb, payload[descLen:descLen+maxLen+tagLen], start, wireLen)',
                  'd.ic.openToWithScratch(pb, payload[descLen:descLen+maxLen+tagLen], start, wireLen, scratch)',
                  'fec decoder open scratch',
              )
              write(p, s)

          # Dedicated microbenchmark measures the intended goroutine-local API
          # directly and reports allocations.
          bench = Path('aead_local_scratch_bench_test.go')
          if not bench.exists():
              bench.write_text(r'''package main

import "testing"

func benchmarkInnerAEADLocalScratch(b *testing.B, algo int) {
	salt := []byte{0, 1, 2, 3, 4, 5, 6, 7}
	tx, err := newInnerCipherForAlgo("local-scratch-bench", salt, algo)
	if err != nil {
		b.Fatal(err)
	}
	rx, err := newInnerCipherForAlgo("local-scratch-bench", salt, algo)
	if err != nil {
		b.Fatal(err)
	}
	pt := make([]byte, 1400)
	buf := make([]byte, len(pt)+tx.tagLen())
	var txScratch, rxScratch nonceAADScratch
	b.SetBytes(int64(len(pt)))
	b.ReportAllocs()
	b.ResetTimer()
	for i := 0; i < b.N; i++ {
		copy(buf, pt)
		seq := uint32(i + 1)
		tx.sealInPlaceWithScratch(buf, len(pt), seq, uint32(len(buf)), &txScratch)
		if _, err := rx.openInPlaceWithScratch(buf, seq, uint32(len(buf)), &rxScratch); err != nil {
			b.Fatal(err)
		}
	}
}

func BenchmarkGCM256SealOpenLocalScratch(b *testing.B) {
	benchmarkInnerAEADLocalScratch(b, encAlgoGCM)
}

func BenchmarkGCM128SealOpenLocalScratch(b *testing.B) {
	benchmarkInnerAEADLocalScratch(b, encAlgoGCM128)
}

func BenchmarkChaCha20SealOpenLocalScratch(b *testing.B) {
	benchmarkInnerAEADLocalScratch(b, encAlgoChaCha20)
}

func BenchmarkXChaCha20SealOpenLocalScratch(b *testing.B) {
	benchmarkInnerAEADLocalScratch(b, encAlgoXChaCha20)
}
''', encoding='utf-8')
          PY
          gofmt -w crypto.go stream_padding.go client.go server.go fec.go aead_local_scratch_bench_test.go

      - name: Verify no shared AEAD scratch pool remains
        run: |
          ! grep -R --line-number --exclude-dir=.git 'aeadScratchPool' .
          grep -q 'sealInPlaceWithScratch' crypto.go
          grep -q 'openInPlaceWithScratch' crypto.go
          grep -q 'appendOwnedFrameBatchStreamWithScratch' stream_padding.go

      - name: Test crypto FEC and framing
        run: |
          go test -count=1 ./... -run 'TestFEC|TestGCM|TestFrameGCM|TestChaCha|TestXChaCha|TestEncAlgo|TestProtocol'
          go test -race -count=1 ./... -run 'TestFEC|TestGCM|TestFrameGCM|TestChaCha|TestXChaCha|TestEncAlgo'

      - name: Benchmark local scratch
        run: |
          go test -run '^$' -bench 'Benchmark(GCM256|GCM128|ChaCha20|XChaCha20)SealOpenLocalScratch$' -benchmem -count=5 . | tee /tmp/aead-local.txt
          go test -run '^$' -bench 'Benchmark(GCMSealOpen|GCM128SealOpen|ChaCha20Poly1305SealOpen|XChaCha20Poly1305SealOpen)$' -benchmem -count=5 . | tee /tmp/aead-after.txt
          echo '--- baseline ---'
          cat /tmp/aead-before.txt 2>/dev/null || true
          echo '--- local scratch ---'
          cat /tmp/aead-local.txt
          echo '--- compatibility wrappers after ---'
          cat /tmp/aead-after.txt

      - name: Commit optimized source
        run: |
          if git diff --quiet -- crypto.go stream_padding.go client.go server.go fec.go aead_local_scratch_bench_test.go; then
            echo 'P0 already applied; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crypto.go stream_padding.go client.go server.go fec.go aead_local_scratch_bench_test.go
          git commit -m 'perf: use goroutine-local AEAD nonce scratch'
          git push origin HEAD:perf/single-path-fec-bypass
