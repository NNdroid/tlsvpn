name: Temporary P2 RX Actor

on:
  push:
    branches:
      - p2/rx-actor-ownership

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Apply P2 actor ownership
        run: |
          python3 .github/tmp_apply_p2.py
          gofmt -w buffer.go rx_actor.go rx_batch.go client.go server.go rx_batch_test.go rx_actor_test.go
      - name: Targeted correctness tests
        run: |
          go test -count=1 ./... -run 'TestRXSessionWorker|TestRXActor|TestFECDecoder|TestFECMode|TestDynamic'
      - name: Actor/FEC race gate
        run: |
          go test -race -count=1 ./... -run 'TestRXSessionWorker|TestRXActor|TestFECDecoder|TestFECMode'
      - name: Actor microbench
        run: |
          go test -run '^$' -bench 'BenchmarkFECDecoderData(Batch16|Actor16)$' -benchmem -count=5 ./...
      - name: Commit P2 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add buffer.go rx_actor.go rx_batch.go client.go server.go rx_batch_test.go rx_actor_test.go
          if git diff --cached --quiet; then
            echo 'No P2 source changes to commit'
            exit 0
          fi
          git commit -m 'perf: make RX session worker the state owner'
          git push origin HEAD:p2/rx-actor-ownership
