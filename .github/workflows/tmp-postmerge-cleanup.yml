name: Temporary post-merge workflow cleanup

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/tmp-postmerge-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move performance workflow to main
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/perf.yml')
          s = p.read_text()
          old = "    branches:\n      - 'perf/**'\n"
          new = "    branches:\n      - main\n      - 'perf/**'\n"
          if old not in s:
              raise SystemExit('perf push branch block not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              "# canonical performance branch. It never writes on pull_request events.",
              "# canonical main branch. Performance branches remain read-only test targets.",
              1,
          )
          old_if = "if: github.ref == 'refs/heads/perf/single-path-fec-bypass'"
          new_if = "if: github.ref == 'refs/heads/main'"
          if old_if not in s:
              raise SystemExit('PGO promotion branch guard not found')
          s = s.replace(old_if, new_if, 1)
          p.write_text(s)
          PY
          git rm .github/workflows/tmp-postmerge-cleanup.yml
          git add .github/workflows/perf.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: finalize main performance workflow'
          git push origin HEAD:main
