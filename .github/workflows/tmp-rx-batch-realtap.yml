name: tmp-rx-batch-realtap

on:
  pull_request:
    types: [reopened]

permissions:
  contents: read

jobs:
  realtap:
    if: github.head_ref == 'perf/single-path-fec-bypass' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout P1 candidate
        uses: actions/checkout@v4
        with:
          ref: perf/single-path-fec-bypass
          path: candidate
      - name: Checkout pre-P1 baseline
        uses: actions/checkout@v4
        with:
          ref: a388696e0e0670a1fa5133ccc6ad678eb9071aea
          path: baseline
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install real-TAP dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iproute2 iperf3 openssl
      - name: Build both sides with their validated default.pgo
        run: |
          set -euo pipefail
          (cd baseline && go build -trimpath -o "$GITHUB_WORKSPACE/tlsvpn-pre-p1" .)
          (cd candidate && go build -trimpath -o "$GITHUB_WORKSPACE/tlsvpn-p1" .)
          go version -m tlsvpn-pre-p1 | grep -E 'go1|pgo='
          go version -m tlsvpn-p1 | grep -E 'go1|pgo='
      - name: Add isolated small-MSS knob to benchmark harness
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/real_tap_perf.sh')
          s = p.read_text()
          s = s.replace('PERF_DIAG_FILE="${PERF_DIAG_FILE:-}"\n', 'PERF_DIAG_FILE="${PERF_DIAG_FILE:-}"\nPERF_IPERF_MSS="${PERF_IPERF_MSS:-}"\n', 1)
          old = 'json=$(ip netns exec "$NS_CLI" iperf3 -c "$GW_V4" -p "$((PORT + 1))" -t "$PERF_SECONDS" -J $extra 2>"$TMP/iperf-$direction.err")'
          new = '''local -a mss_args=()\n  [[ -n "$PERF_IPERF_MSS" ]] && mss_args=(-M "$PERF_IPERF_MSS")\n  json=$(ip netns exec "$NS_CLI" iperf3 -c "$GW_V4" -p "$((PORT + 1))" -t "$PERF_SECONDS" -J "${mss_args[@]}" $extra 2>"$TMP/iperf-$direction.err")'''
          if old not in s:
              raise SystemExit('iperf anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          bash -n scripts/real_tap_perf.sh
      - name: Run paired multi-connection RX/FEC matrix
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../p1-results
          printf 'scenario\timpl\tconns\tenc_algo\tpad_mode\tdirection\tmbps\n' > ../p1-results/results.tsv
          run_one() {
            local scenario="$1" impl="$2" bin="$3" conns="$4" mss="$5" tmp
            tmp=$(mktemp)
            printf 'conns\tenc_algo\tpad_mode\tdirection\tmbps\n' > "$tmp"
            echo "=== scenario=$scenario impl=$impl conns=$conns mss=${mss:-default} ==="
            sudo -E env \
              BIN="$bin" PERF_CONNS="$conns" PERF_ENC_ALGO=gcm256 PERF_PAD_MODE=bucket \
              PERF_FEC=true PERF_FEC_GROUP=4 PERF_DIRECTION=both PERF_SECONDS=4 \
              PERF_MIN_MBPS=100 PERF_IPERF_MSS="$mss" PERF_RESULT_FILE="$tmp" \
              bash scripts/real_tap_perf.sh
            tail -n +2 "$tmp" | awk -v sc="$scenario" -v im="$impl" 'BEGIN{OFS="\t"}{print sc,im,$0}' >> ../p1-results/results.tsv
            rm -f "$tmp"
          }
          BASE="$GITHUB_WORKSPACE/tlsvpn-pre-p1"
          CAND="$GITHUB_WORKSPACE/tlsvpn-p1"
          # Reverse implementation order on conns=4 to reduce runner temporal bias.
          run_one normal baseline  "$BASE" 2 ''
          run_one normal candidate "$CAND" 2 ''
          run_one normal candidate "$CAND" 4 ''
          run_one normal baseline  "$BASE" 4 ''
          run_one mss256 baseline  "$BASE" 2 256
          run_one mss256 candidate "$CAND" 2 256
          run_one mss256 candidate "$CAND" 4 256
          run_one mss256 baseline  "$BASE" 4 256
      - name: Compare P1 vs pre-P1
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, math
          from collections import defaultdict
          rows=list(csv.DictReader(open('p1-results/results.tsv'), delimiter='\t'))
          data={}
          for r in rows:
              key=(r['scenario'],r['conns'],r['direction'])
              data.setdefault(key,{})[r['impl']]=float(r['mbps'])
          out=[]
          ratios=defaultdict(list)
          for key in sorted(data):
              v=data[key]
              if set(v) != {'baseline','candidate'}:
                  raise SystemExit(f'incomplete pair {key}: {v}')
              ratio=v['candidate']/v['baseline']
              delta=(ratio-1)*100
              out.append((*key,v['baseline'],v['candidate'],delta))
              ratios[(key[0],key[1])].append(ratio)
          with open('p1-results/comparison.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t')
              w.writerow(['scenario','conns','direction','pre_p1_mbps','p1_mbps','delta_pct'])
              for r in out:
                  w.writerow([*r[:3],f'{r[3]:.1f}',f'{r[4]:.1f}',f'{r[5]:+.2f}'])
          lines=[]
          for k, rs in sorted(ratios.items()):
              geo=(math.exp(sum(map(math.log,rs))/len(rs))-1)*100
              lines.append(f'{k[0]} conns={k[1]} geomean: {geo:+.2f}%')
          all_normal=[x for (sc,_),vals in ratios.items() if sc=='normal' for x in vals]
          all_small=[x for (sc,_),vals in ratios.items() if sc=='mss256' for x in vals]
          lines.append(f'normal aggregate geomean: {(math.exp(sum(map(math.log,all_normal))/len(all_normal))-1)*100:+.2f}%')
          lines.append(f'mss256 aggregate geomean: {(math.exp(sum(map(math.log,all_small))/len(all_small))-1)*100:+.2f}%')
          open('p1-results/summary.txt','w').write('\n'.join(lines)+'\n')
          print(open('p1-results/comparison.tsv').read())
          print(open('p1-results/summary.txt').read())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rx-batch-realtap
          path: p1-results/
          retention-days: 14
