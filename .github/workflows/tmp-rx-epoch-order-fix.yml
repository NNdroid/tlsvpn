name: tmp-rx-epoch-order-fix

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'perf/single-path-fec-bypass' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/single-path-fec-bypass
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Move epoch barrier before FEC reset/rekey
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client.go')
          s = p.read_text()
          block = '''\tisNewSession := false\n\tif c.serverSessionID != resp.SessionID || c.sessionEpoch != resp.SessionEpoch {\n\t\tisNewSession = true\n\t\tc.serverSessionID = resp.SessionID\n\t\tc.sessionEpoch = resp.SessionEpoch\n\t}\n\tif isNewSession && c.rxWorker != nil {\n\t\tc.rxWorker.AdvanceEpoch()\n\t}\n'''
          if s.count(block) != 1:
              raise SystemExit(f'expected one current epoch block, got {s.count(block)}')
          s = s.replace(block, '', 1)
          anchor = '\tfecRebuild := false\n'
          if s.count(anchor) != 1:
              raise SystemExit(f'expected one fecRebuild anchor, got {s.count(anchor)}')
          moved = '''\t// Resolve the receive epoch before touching decoder state. Multi-connection\n\t// readers may still own partial batches from the old key/session generation;\n\t// AdvanceEpoch invalidates them and waits for all already-queued work before\n\t// FEC/reorder are reset or rebound below.\n\tisNewSession := false\n\tif c.serverSessionID != resp.SessionID || c.sessionEpoch != resp.SessionEpoch {\n\t\tisNewSession = true\n\t\tc.serverSessionID = resp.SessionID\n\t\tc.sessionEpoch = resp.SessionEpoch\n\t}\n\tif isNewSession && c.rxWorker != nil {\n\t\tc.rxWorker.AdvanceEpoch()\n\t}\n\n'''
          s = s.replace(anchor, moved + anchor, 1)
          p.write_text(s)
          PY
          gofmt -w client.go
          git diff --check
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -run 'TestRXSessionWorker|TestFEC|TestReorder|TestFrame' -count=1
          go test -race ./... -run 'TestRXSessionWorker|TestFEC|TestReorder|TestControl' -count=1
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git add client.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: fence RX worker before session rekey'
          git push origin HEAD:perf/single-path-fec-bypass
