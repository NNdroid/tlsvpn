name: tmp-rx-session-batch-worker

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'perf/single-path-fec-bypass' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/single-path-fec-bypass
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Apply session RX batch worker
        shell: bash
        run: |
          set -euo pipefail
          cat > rx_batch.go <<'EOF'
          package main

          import (
          	"sync"
          	"sync/atomic"
          )

          const (
          	// A 16-frame producer batch is large enough to amortize queue + FEC/reorder
          	// synchronization while still fitting the common ~16 KiB scanner read burst.
          	rxSessionBatchCap   = 16
          	rxSessionQueueDepth = 256
          )

          type rxSessionBatch struct {
          	frames     [rxSessionBatchCap]VPNFrame
          	n          int
          	fec        *fecDecoder
          	generation uint64
          	fail       func(error)
          }

          func newRXSessionBatch() any { return new(rxSessionBatch) }

          var rxSessionBatchPool = sync.Pool{New: newRXSessionBatch}

          func getRXSessionBatch() *rxSessionBatch {
          	b := rxSessionBatchPool.Get().(*rxSessionBatch)
          	b.n = 0
          	b.fec = nil
          	b.generation = 0
          	b.fail = nil
          	return b
          }

          func putRXSessionBatch(b *rxSessionBatch) {
          	if b == nil {
          		return
          	}
          	clear(b.frames[:b.n])
          	b.n = 0
          	b.fec = nil
          	b.generation = 0
          	b.fail = nil
          	rxSessionBatchPool.Put(b)
          }

          func freeRXSessionBatch(b *rxSessionBatch) {
          	if b == nil {
          		return
          	}
          	freeFrames(b.frames[:b.n])
          	putRXSessionBatch(b)
          }

          type rxSessionWork struct {
          	batch   *rxSessionBatch
          	barrier chan struct{}
          }

          // rxSessionWorker is the single mutation owner for a multi-connection RX
          // session. Physical TCP readers only decrypt and enqueue owned batches;
          // FEC, reorder and ordered delivery are serialized here at batch granularity.
          type rxSessionWorker struct {
          	reorder *ReorderBuffer
          	queue   chan rxSessionWork

          	generation atomic.Uint64
          	closing    atomic.Bool
          	enqueueMu  sync.RWMutex
          	closed     chan struct{}
          	done       chan struct{}
          	closeOnce  sync.Once
          }

          func newRXSessionWorker(reorder *ReorderBuffer) *rxSessionWorker {
          	w := &rxSessionWorker{
          		reorder: reorder,
          		queue:   make(chan rxSessionWork, rxSessionQueueDepth),
          		closed:  make(chan struct{}),
          		done:    make(chan struct{}),
          	}
          	w.generation.Store(1)
          	go w.run()
          	return w
          }

          func (w *rxSessionWorker) enqueue(work rxSessionWork) bool {
          	if w == nil {
          		return false
          	}
          	w.enqueueMu.RLock()
          	defer w.enqueueMu.RUnlock()
          	if w.closing.Load() {
          		return false
          	}
          	select {
          	case w.queue <- work:
          		return true
          	case <-w.closed:
          		return false
          	}
          }

          // AdvanceEpoch invalidates all existing producers and establishes a queue
          // barrier. After it returns, no batch queued before the barrier can still
          // mutate FEC/reorder state, so callers may safely Reset/rekey them.
          func (w *rxSessionWorker) AdvanceEpoch() {
          	if w == nil || w.closing.Load() {
          		return
          	}
          	w.generation.Add(1)
          	done := make(chan struct{})
          	if !w.enqueue(rxSessionWork{barrier: done}) {
          		return
          	}
          	select {
          	case <-done:
          	case <-w.closed:
          	}
          }

          func (w *rxSessionWorker) Close() {
          	if w == nil {
          		return
          	}
          	w.closeOnce.Do(func() {
          		w.enqueueMu.Lock()
          		w.closing.Store(true)
          		close(w.closed)
          		w.enqueueMu.Unlock()
          		<-w.done
          	})
          }

          func (w *rxSessionWorker) run() {
          	defer close(w.done)
          	for {
          		select {
          		case work := <-w.queue:
          			w.process(work)
          		case <-w.closed:
          			for {
          				select {
          				case work := <-w.queue:
          					if work.batch != nil {
          						freeRXSessionBatch(work.batch)
          					}
          					if work.barrier != nil {
          						close(work.barrier)
          					}
          				default:
          					return
          				}
          			}
          		}
          	}
          }

          func (w *rxSessionWorker) process(work rxSessionWork) {
          	if work.barrier != nil {
          		close(work.barrier)
          		return
          	}
          	b := work.batch
          	if b == nil {
          		return
          	}
          	defer putRXSessionBatch(b)
          	if b.generation != w.generation.Load() {
          		freeFrames(b.frames[:b.n])
          		return
          	}

          	var controlScratch nonceAADScratch
          	for i := 0; i < b.n; {
          		if b.frames[i].Seq == 0 {
          			frame := b.frames[i].Data
          			b.frames[i].Data = nil
          			if b.fec == nil {
          				putFrame(frame)
          				w.failBatch(b, i+1, errRXControlWithoutFEC)
          				return
          			}
          			err := b.fec.OnControlWithScratch(frame, &controlScratch)
          			putFrame(frame)
          			if err != nil {
          				w.failBatch(b, i+1, err)
          				return
          			}
          			i++
          			continue
          		}

          		j := i + 1
          		for j < b.n && b.frames[j].Seq != 0 {
          			j++
          		}
          		segment := b.frames[i:j]
          		if b.fec != nil {
          			b.fec.OnDataBatch(segment)
          		}
          		w.reorder.InsertBatch(segment)
          		// InsertBatch consumes ownership even when a frame is duplicate/stale.
          		for k := range segment {
          			segment[k].Data = nil
          		}
          		i = j
          	}
          }

          func (w *rxSessionWorker) failBatch(b *rxSessionBatch, next int, err error) {
          	for i := next; i < b.n; i++ {
          		if b.frames[i].Data != nil {
          			putFrame(b.frames[i].Data)
          			b.frames[i].Data = nil
          		}
          	}
          	if b.fail != nil {
          		b.fail(err)
          	}
          }

          type rxBatchProducer struct {
          	worker     *rxSessionWorker
          	fec        *fecDecoder
          	fail       func(error)
          	generation uint64
          	batch      *rxSessionBatch
          }

          func (w *rxSessionWorker) NewProducer(fec *fecDecoder, fail func(error)) *rxBatchProducer {
          	if w == nil {
          		return nil
          	}
          	return &rxBatchProducer{worker: w, fec: fec, fail: fail, generation: w.generation.Load()}
          }

          func (p *rxBatchProducer) Push(seq uint32, frame []byte) {
          	if p == nil {
          		return
          	}
          	if frame == nil {
          		return
          	}
          	if p.batch == nil {
          		p.batch = getRXSessionBatch()
          		p.batch.fec = p.fec
          		p.batch.fail = p.fail
          		p.batch.generation = p.generation
          	}
          	p.batch.frames[p.batch.n] = VPNFrame{Seq: seq, Data: frame}
          	p.batch.n++
          	if p.batch.n == rxSessionBatchCap {
          		p.Flush()
          	}
          }

          func (p *rxBatchProducer) Flush() {
          	if p == nil || p.batch == nil {
          		return
          	}
          	b := p.batch
          	p.batch = nil
          	if b.n == 0 {
          		putRXSessionBatch(b)
          		return
          	}
          	if !p.worker.enqueue(rxSessionWork{batch: b}) {
          		freeRXSessionBatch(b)
          	}
          }

          var errRXControlWithoutFEC = &rxProtocolError{"typed control without negotiated FEC"}

          type rxProtocolError struct{ msg string }

          func (e *rxProtocolError) Error() string { return e.msg }
          EOF

          cat > rx_batch_test.go <<'EOF'
          package main

          import (
          	"sync"
          	"testing"
          	"time"
          )

          func pooledTestFrame(v byte) []byte {
          	b := getFrameAtLeast(64)[:64]
          	b[0] = v
          	return b
          }

          func TestRXSessionWorkerBatchesAcrossProducers(t *testing.T) {
          	var mu sync.Mutex
          	got := make([]byte, 0, 4)
          	done := make(chan struct{})
          	rb := NewReorderBuffer(func(frame []byte) {
          		mu.Lock()
          		got = append(got, frame[0])
          		if len(got) == 4 {
          			select { case <-done: default: close(done) }
          		}
          		mu.Unlock()
          	})
          	w := newRXSessionWorker(rb)
          	defer func() { w.Close(); rb.Close() }()

          	p1 := w.NewProducer(nil, func(err error) { t.Errorf("unexpected RX error: %v", err) })
          	p2 := w.NewProducer(nil, func(err error) { t.Errorf("unexpected RX error: %v", err) })
          	p1.Push(1, pooledTestFrame(1))
          	p1.Push(3, pooledTestFrame(3))
          	p1.Flush()
          	p2.Push(2, pooledTestFrame(2))
          	p2.Push(4, pooledTestFrame(4))
          	p2.Flush()

          	select {
          	case <-done:
          	case <-time.After(2 * time.Second):
          		t.Fatal("timed out waiting for ordered RX delivery")
          	}
          	mu.Lock()
          	defer mu.Unlock()
          	for i, want := range []byte{1, 2, 3, 4} {
          		if got[i] != want {
          			t.Fatalf("ordered byte[%d]=%d want=%d (all=%v)", i, got[i], want, got)
          		}
          	}
          }

          func TestRXSessionWorkerEpochDropsStaleProducer(t *testing.T) {
          	got := make(chan byte, 2)
          	rb := NewReorderBuffer(func(frame []byte) { got <- frame[0] })
          	w := newRXSessionWorker(rb)
          	defer func() { w.Close(); rb.Close() }()

          	stale := w.NewProducer(nil, nil)
          	stale.Push(1, pooledTestFrame(9))
          	w.AdvanceEpoch()
          	stale.Flush()

          	fresh := w.NewProducer(nil, nil)
          	fresh.Push(1, pooledTestFrame(1))
          	fresh.Flush()
          	select {
          	case v := <-got:
          		if v != 1 { t.Fatalf("stale epoch delivered byte=%d", v) }
          	case <-time.After(2 * time.Second):
          		t.Fatal("fresh epoch frame not delivered")
          	}
          }

          func BenchmarkFECDecoderDataSerial16(b *testing.B) {
          	d := NewFECDecoder(4, nil, nil)
          	frame := make([]byte, 256)
          	seq := uint32(1)
          	b.ReportAllocs()
          	b.SetBytes(16 * int64(len(frame)))
          	for n := 0; n < b.N; n++ {
          		for i := 0; i < 16; i++ {
          			d.OnData(seq, frame)
          			seq++
          		}
          	}
          }

          func BenchmarkFECDecoderDataBatch16(b *testing.B) {
          	d := NewFECDecoder(4, nil, nil)
          	frame := make([]byte, 256)
          	var batch [16]VPNFrame
          	seq := uint32(1)
          	b.ReportAllocs()
          	b.SetBytes(16 * int64(len(frame)))
          	for n := 0; n < b.N; n++ {
          		for i := range batch {
          			batch[i] = VPNFrame{Seq: seq, Data: frame}
          			seq++
          		}
          		d.OnDataBatch(batch[:])
          	}
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              s2 = s.replace(old, new, count)
              p.write_text(s2)

          # FrameScanner: expose whether another complete frame is already buffered.
          replace('frame.go',
          'func (fs *FrameScanner) ReadFrame() ([]byte, uint32, error) {\n',
          '''// BufferedFrameReady reports whether ReadFrame can consume one more complete\n// frame without another socket/TLS read. RX producers use this to flush a partial\n// session batch before they would block, preserving interactive latency.\nfunc (fs *FrameScanner) BufferedFrameReady() bool {\n\tconst headerSize = 10\n\tavailable := len(fs.buf) - fs.offset\n\tif available < headerSize {\n\t\treturn false\n\t}\n\trawDataLen := binary.BigEndian.Uint32(fs.buf[fs.offset : fs.offset+4])\n\tif uint64(rawDataLen) > uint64(fs.maxDataLen) {\n\t\t// Let ReadFrame report the protocol error immediately rather than delaying\n\t\t// the current batch in an attempt to coalesce with malformed input.\n\t\treturn false\n\t}\n\tpadLen := int(binary.BigEndian.Uint16(fs.buf[fs.offset+4 : fs.offset+6]))\n\treturn available >= headerSize+int(rawDataLen)+padLen\n}\n\nfunc (fs *FrameScanner) ReadFrame() ([]byte, uint32, error) {\n''')

          # Reorder: one mutex acquisition and one delivery handoff per RX batch.
          replace('buffer.go',
          '// insertLocked 单帧入槽 + 尝试按序输出（调用方须持锁）\n',
          '''// InsertBatch consumes a reader-owned batch with one reorder critical section.\n// It is the multi-connection RX worker hot path; Insert remains for recovered frames\n// and compatibility callers. Every Data buffer is consumed regardless of outcome.\nfunc (rb *ReorderBuffer) InsertBatch(frames []VPNFrame) {\n\tif len(frames) == 0 {\n\t\treturn\n\t}\n\trb.mu.Lock()\n\tif rb.shutting {\n\t\trb.mu.Unlock()\n\t\tfreeFrames(frames)\n\t\treturn\n\t}\n\twake := false\n\tfor i := range frames {\n\t\tframe := frames[i].Data\n\t\tif frames[i].Seq == 0 {\n\t\t\tif frame != nil {\n\t\t\t\tputFrame(frame)\n\t\t\t}\n\t\t\tframes[i].Data = nil\n\t\t\tcontinue\n\t\t}\n\t\tif rb.insertLocked(frames[i].Seq, frame) {\n\t\t\twake = true\n\t\t}\n\t\tframes[i].Data = nil\n\t}\n\tbatch := rb.takePendingLocked()\n\tif batch != nil {\n\t\trb.deliverMu.Lock()\n\t}\n\trb.mu.Unlock()\n\tif wake {\n\t\trb.signalGapWorker()\n\t}\n\trb.deliver(batch)\n\tif batch != nil {\n\t\trb.deliverMu.Unlock()\n\t}\n}\n\n// insertLocked 单帧入槽 + 尝试按序输出（调用方须持锁）\n''')

          # FEC: one decoder mutex acquisition for a contiguous data segment.
          replace('fec.go',
          '// OnParity 处理一个校验帧负载。payload 只读借用，不转移所有权。\n',
          '''// OnDataBatch records a contiguous run of decrypted data frames while taking\n// the shared decoder mutex once. Multi-connection readers never call this directly;\n// the session RX worker is the sole hot-path caller.\nfunc (d *fecDecoder) OnDataBatch(frames []VPNFrame) {\n\tif len(frames) == 0 || d.staticSingle.Load() {\n\t\treturn\n\t}\n\td.mu.Lock()\n\tdefer d.mu.Unlock()\n\tfor i := range frames {\n\t\tseq, frame := frames[i].Seq, frames[i].Data\n\t\tif len(frame) == 0 || seq == 0 {\n\t\t\tcontinue\n\t\t}\n\t\tif d.staticSingle.Load() {\n\t\t\tcontinue\n\t\t}\n\t\tif d.fence.BypassData(seq) {\n\t\t\tif seq&0xff == 0 {\n\t\t\t\td.maybeRetireOldGroupsLocked()\n\t\t\t}\n\t\t\tcontinue\n\t\t}\n\t\tretired := d.retiredBefore.Load()\n\t\tif retired != 0 && seq < retired {\n\t\t\tcontinue\n\t\t}\n\t\tstart := d.groupStartOf(seq)\n\t\tif d.isDoneLocked(start) {\n\t\t\tcontinue\n\t\t}\n\t\tg, ok := d.groups[start]\n\t\tif !ok {\n\t\t\tg = d.newGroupLocked(start)\n\t\t}\n\t\tbit := uint64(seq - start)\n\t\tmask := uint64(1) << bit\n\t\tif g.gotMask&mask != 0 {\n\t\t\tcontinue\n\t\t}\n\t\tg.gotMask |= mask\n\t\tif g.gotMask == d.fullMask {\n\t\t\td.finishGroupLocked(g)\n\t\t\tcontinue\n\t\t}\n\t\tif len(frame) > len(g.acc) {\n\t\t\tg.acc = d.growAccLocked(g.acc, len(frame))\n\t\t}\n\t\tsubtle.XORBytes(g.acc[:len(frame)], g.acc[:len(frame)], frame)\n\t\td.tryRecoverLocked(g)\n\t}\n}\n\n// OnParity 处理一个校验帧负载。payload 只读借用，不转移所有权。\n''')

          # Client wiring: worker only for configured multi-connection sessions.
          replace('client.go',
          '\ttxPort           *AsyncPort\n\trxReorder        *ReorderBuffer\n\tfecDec           *fecDecoder\n',
          '\ttxPort           *AsyncPort\n\trxReorder        *ReorderBuffer\n\trxWorker         *rxSessionWorker\n\tfecDec           *fecDecoder\n')
          replace('client.go',
          '''\t} else {\n\t\tc.rxReorder = NewReorderBuffer(func(orderedFrame []byte) {\n\t\t\tif _, werr := c.tap.Write(orderedFrame); werr != nil {\n\t\t\t\treportTapWriteErr(werr)\n\t\t\t}\n\t\t})\n\t}\n''',
          '''\t} else {\n\t\tc.rxReorder = NewReorderBuffer(func(orderedFrame []byte) {\n\t\t\tif _, werr := c.tap.Write(orderedFrame); werr != nil {\n\t\t\t\treportTapWriteErr(werr)\n\t\t\t}\n\t\t})\n\t\tc.rxWorker = newRXSessionWorker(c.rxReorder)\n\t}\n''')
          replace('client.go',
          '\t\tc.rxReorder.Close()\n\t\tc.txPort.Close()\n',
          '\t\tif c.rxWorker != nil {\n\t\t\tc.rxWorker.Close()\n\t\t}\n\t\tc.rxReorder.Close()\n\t\tc.txPort.Close()\n')
          replace('client.go',
          '\tfecRebuild := false\n',
          '\tif isNewSession && c.rxWorker != nil {\n\t\tc.rxWorker.AdvanceEpoch()\n\t}\n\tfecRebuild := false\n')
          replace('client.go',
          '''\t\tvar rxBytesBatch, rxPacketsBatch uint64\n\t\tvar rxAEADScratch nonceAADScratch\n''',
          '''\t\tvar rxBytesBatch, rxPacketsBatch uint64\n\t\tvar rxAEADScratch nonceAADScratch\n\t\tvar rxProducer *rxBatchProducer\n\t\tif c.rxWorker != nil {\n\t\t\trxProducer = c.rxWorker.NewProducer(c.fecDec, func(cerr error) {\n\t\t\t\tselect {\n\t\t\t\tcase errChan <- fmt.Errorf("protocol v%d control: %w", protocolVersion, cerr):\n\t\t\t\tdefault:\n\t\t\t\t}\n\t\t\t\t_ = tlsConn.Close()\n\t\t\t})\n\t\t\tdefer rxProducer.Flush()\n\t\t}\n''')
          replace('client.go',
          '''\t\t\t\t\tif cerr := c.fecDec.OnControlWithScratch(frame, &rxAEADScratch); cerr != nil {\n''',
          '''\t\t\t\t\tif rxProducer != nil {\n\t\t\t\t\t\trxProducer.Push(0, frame)\n\t\t\t\t\t\tif !scanner.BufferedFrameReady() {\n\t\t\t\t\t\t\trxProducer.Flush()\n\t\t\t\t\t\t}\n\t\t\t\t\t\tcontinue\n\t\t\t\t\t}\n\t\t\t\t\tif cerr := c.fecDec.OnControlWithScratch(frame, &rxAEADScratch); cerr != nil {\n''')
          replace('client.go',
          '''\t\t\t\tif useXorFec {\n\t\t\t\t\tc.fecDec.OnData(seq, frame)\n\t\t\t\t}\n\t\t\t\t// 丢入重排缓冲区，后续的 Write 和 putFrame 由缓冲区内部接管\n\t\t\t\tc.rxReorder.Insert(seq, frame)\n''',
          '''\t\t\t\tif rxProducer != nil {\n\t\t\t\t\trxProducer.Push(seq, frame)\n\t\t\t\t\tif !scanner.BufferedFrameReady() {\n\t\t\t\t\t\trxProducer.Flush()\n\t\t\t\t\t}\n\t\t\t\t\tcontinue\n\t\t\t\t}\n\t\t\t\tif useXorFec {\n\t\t\t\t\tc.fecDec.OnData(seq, frame)\n\t\t\t\t}\n\t\t\t\t// 丢入重排缓冲区，后续的 Write 和 putFrame 由缓冲区内部接管\n\t\t\t\tc.rxReorder.Insert(seq, frame)\n''')

          # Server wiring: keep single-path direct RX fast path; batch unknown/multi-path sessions.
          replace('server.go',
          '\tRxReorder          *ReorderBuffer\n\tFecDec             *fecDecoder       // XOR 奇偶校验解码器（req.FecGroup >= 2 时启用）\n',
          '\tRxReorder          *ReorderBuffer\n\tRxWorker           *rxSessionWorker\n\tFecDec             *fecDecoder       // XOR 奇偶校验解码器（req.FecGroup >= 2 时启用）\n')
          replace('server.go',
          '''\t\tsession.RxReorder = NewOwnedReorderBuffer(func(orderedFrame []byte) {\n\t\t\tif session.macBin != (macKey{}) {\n\t\t\t\ts.vswitch.ProcessOwnedSessionFrame(clientID, session.macBin, orderedFrame)\n\t\t\t} else {\n\t\t\t\ts.vswitch.ProcessOwnedFrame(clientID, orderedFrame)\n\t\t\t}\n\t\t})\n''',
          '''\t\tsession.RxReorder = NewOwnedReorderBuffer(func(orderedFrame []byte) {\n\t\t\tif session.macBin != (macKey{}) {\n\t\t\t\ts.vswitch.ProcessOwnedSessionFrame(clientID, session.macBin, orderedFrame)\n\t\t\t} else {\n\t\t\t\ts.vswitch.ProcessOwnedFrame(clientID, orderedFrame)\n\t\t\t}\n\t\t})\n\t\tif !isStaticSinglePathTopology(req.BrutalConns) {\n\t\t\tsession.RxWorker = newRXSessionWorker(session.RxReorder)\n\t\t}\n''')
          replace('server.go',
          '''\tfor ci := range session.conns {\n\t\tci.tcpConn.Close()\n\t}\n\tsaltA, saltB := newRandomSalt(), newRandomSalt()\n''',
          '''\tfor ci := range session.conns {\n\t\tci.tcpConn.Close()\n\t}\n\tif session.RxWorker != nil {\n\t\tsession.RxWorker.AdvanceEpoch()\n\t}\n\tsaltA, saltB := newRandomSalt(), newRandomSalt()\n''')
          replace('server.go',
          '''\tif session.RxReorder != nil {\n\t\tsession.RxReorder.Close()\n\t}\n\tsession.Port.Close()\n''',
          '''\tif session.RxWorker != nil {\n\t\tsession.RxWorker.Close()\n\t}\n\tif session.RxReorder != nil {\n\t\tsession.RxReorder.Close()\n\t}\n\tsession.Port.Close()\n''')
          replace('server.go',
          '''\tvar rxBytesBatch, rxPacketsBatch uint64\n\tvar rxAEADScratch nonceAADScratch\n''',
          '''\tvar rxBytesBatch, rxPacketsBatch uint64\n\tvar rxAEADScratch nonceAADScratch\n\tsession.sessionMu.RLock()\n\trxWorkerForConn := session.RxWorker\n\tfecForConn := session.FecDec\n\tsession.sessionMu.RUnlock()\n\tvar rxProducer *rxBatchProducer\n\tif rxWorkerForConn != nil {\n\t\trxProducer = rxWorkerForConn.NewProducer(fecForConn, func(cerr error) {\n\t\t\tlog.Debugf("[%s] protocol v%d control violation: %v", clientID, protocolVersion, cerr)\n\t\t\t_ = conn.Close()\n\t\t})\n\t\tdefer rxProducer.Flush()\n\t}\n''')
          replace('server.go',
          '''\t\t\t\tif cerr := fecDec.OnControlWithScratch(frame, &rxAEADScratch); cerr != nil {\n''',
          '''\t\t\t\tif rxProducer != nil {\n\t\t\t\t\trxProducer.Push(0, frame)\n\t\t\t\t\tif !scanner.BufferedFrameReady() {\n\t\t\t\t\t\trxProducer.Flush()\n\t\t\t\t\t}\n\t\t\t\t\tcontinue\n\t\t\t\t}\n\t\t\t\tif cerr := fecDec.OnControlWithScratch(frame, &rxAEADScratch); cerr != nil {\n''')
          replace('server.go',
          '''\t\t\tif fecDec != nil {\n\t\t\t\tfecDec.OnData(seq, frame)\n\t\t\t}\n\t\t\t// 交给重排缓冲区\n\t\t\trxReorder.Insert(seq, frame)\n''',
          '''\t\t\tif rxProducer != nil {\n\t\t\t\trxProducer.Push(seq, frame)\n\t\t\t\tif !scanner.BufferedFrameReady() {\n\t\t\t\t\trxProducer.Flush()\n\t\t\t\t}\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tif fecDec != nil {\n\t\t\t\tfecDec.OnData(seq, frame)\n\t\t\t}\n\t\t\t// 交给重排缓冲区\n\t\t\trxReorder.Insert(seq, frame)\n''')
          PY

          gofmt -w rx_batch.go rx_batch_test.go frame.go buffer.go fec.go client.go server.go
          git diff --check

      - name: Validate RX batch worker
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -run 'TestRXSessionWorker|TestFEC|TestReorder|TestFrame' -count=1
          go test -race ./... -run 'TestRXSessionWorker|TestFEC|TestReorder' -count=1
          go test -run '^$' -bench 'BenchmarkFECDecoderData(Serial16|Batch16)$' -benchmem -count=5 . | tee /tmp/rx-batch-bench.txt

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git add rx_batch.go rx_batch_test.go frame.go buffer.go fec.go client.go server.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'perf: batch multi-connection RX per session'
          git push origin HEAD:perf/single-path-fec-bypass
