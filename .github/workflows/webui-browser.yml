name: WebUI Browser Smoke

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check i18n coverage
        run: node scripts/check_i18n.mjs
      - name: Verify nonzero metric formulas and restart boundaries
        run: node scripts/webui_metrics_regression.mjs
      - name: Install Playwright
        run: |
          # 1.55.0 does not support chromium on ubuntu-26.04 (GitHub moved
          # ubuntu-latest to 26.04 in Oct 2026); 1.65.0 adds that support.
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Run WebUI in Chromium and fail on browser errors
        run: node scripts/webui_browser_smoke.mjs
      - name: Validate MCP examples across locales and auth modes
        run: node scripts/mcp_webui_browser_smoke.mjs
